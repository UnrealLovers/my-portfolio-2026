   ========================================================================== */
RCP._connect('Staff', function (Core, Modules) {
  const CFG = Core.CONFIG;
  const S = Core.Security;
  const Store = Core.Store;
  const RBAC = Core.RBAC;

  /* ------------------------------------ MULTIMEDIA MODERATION QUEUE (ALL CHANNELS) ----- */
  function viewQueue(container) {
    const UI = Modules.UI;
    const me = Modules.Auth.current();
    const filterState = { channel: 'all' };

    function lockBanner(q) {
      const mine = q.reviewBy === me.usn;
      const expired = (Date.now() - (q.lockAt || 0)) > CFG.LOCK_TTL_MS;
      let html = '<div class="lock-banner' + (mine ? ' mine' : '') + '">' + UI.icon('lock', 15) +
        '<span>Under Review by Staff ' + S.esc(q.reviewBy) + (expired ? ' (lock expired)' : '') + '</span><span class="spacer"></span>';
      if (mine) html += '<button type="button" class="btn btn-sm btn-ghost" data-release="' + q.id + '">Release Lock</button>';
      else if (expired || RBAC.can(me.role, 'queue.forcerelease')) html += '<button type="button" class="btn btn-sm btn-ghost" data-takeover="' + q.id + '">Take Over Review</button>';
      return html + '</div>';
    }

    function channelMeta(q) {
      const pType = q.postType || 'market';
      if (pType === 'showcase') {
        return {
          key: 'showcase',
          badge: '<span class="channel-pill" data-channel="showcase">' + UI.icon('spark', 12) + ' 🎨 DASHBOARD SHOWCASE (PAMER KARYA)</span>',
          approveLabel: 'Approve & Publish to Dashboard Showcase',
          rightBadge: '<span class="chip">Non-Commercial Portfolio</span>'
        };
      }
      if (pType === 'forum') {
        const sevLabel = q.severity === 'critical' ? '🚨 Keluhan Fatal' : q.severity === 'annoying' ? '😤 Bikin Emosi' : '💬 Diskusi / Media';
        return {
          key: 'forum',
          badge: '<span class="channel-pill" data-channel="forum">' + UI.icon('flame', 12) + ' 🔥 FORUM KELUHAN ROBLOX</span>',
          approveLabel: 'Approve & Publish to Forum Keluhan',
          rightBadge: '<span class="severity-pill" data-sev="' + S.esc(q.severity || 'critical') + '">' + S.esc(sevLabel) + '</span>'
        };
      }
      return {
        key: 'market',
        badge: '<span class="channel-pill" data-channel="market">' + UI.icon('bag', 12) + ' 🛒 MARKETPLACE ASSET (FOR SALE)</span>',
        approveLabel: 'Approve & Sign into Marketplace',
        rightBadge: '<span class="price-badge' + (Number(q.price) === 0 ? ' free' : '') + '">' + UI.icon('coin', 13) + ' ' + S.esc(UI.robux(q.price)) + '</span>'
      };
    }

    function queueCard(q) {
      const creator = Store.get('users', q.creatorUSN);
      const authorRole = (creator && creator.role) || q.creatorRole || 'user';
      const lockedByOther = q.state === 'review' && q.reviewBy !== me.usn;
      const isMine = q.state === 'review' && q.reviewBy === me.usn;
      const cMeta = channelMeta(q);

      const mediaTelemetry = q.media
        ? '<div class="media-meta-strip">' +
          '<span><strong>Format:</strong> ' + S.esc(q.media.mime || q.media.kind.toUpperCase()) + '</span>' +
          '<span>· <strong>Size:</strong> ' + S.esc(UI.fmtBytes(q.media.size || 0)) + '</span>' +
          (q.media.dimensions ? '<span>· <strong>Res:</strong> ' + S.esc(q.media.dimensions) + '</span>' : '') +
          (q.media.duration ? '<span>· <strong>Len:</strong> ' + S.esc(q.media.duration) + 's</span>' : '') +
          '</div>'
        : '<div class="media-meta-strip"><span>No binary media attached (Text / Code only)</span></div>';

      const luauPreview = q.luauManifest
        ? '<div class="field" style="margin-top:4px"><span class="label">Submitted Luau / RBXM Manifest</span>' +
          '<pre class="code-snippet-box">' + S.esc(S.guard(q.luauManifest)) + '</pre></div>'
        : '';

      return '<div class="queue-card' + (isMine ? ' in-review-mine' : '') + '" data-qid="' + S.esc(q.id) + '">' +
        '<div class="queue-media-col">' +
        UI.mediaNode(q.media, 'asset-media', true, q.id) +
        mediaTelemetry +
        '<button type="button" class="btn btn-sm btn-ghost btn-block" data-expand-media="' + S.esc(q.id) + '">' +
        UI.icon('maximize', 14) + ' Open Full Media & Code Inspector</button>' +
        '</div>' +

        '<div class="col" style="gap:10px;min-width:0">' +
        '<div class="row between wrap">' +
        '<div class="row wrap" style="gap:8px">' + cMeta.badge + '<strong style="font-size:15.5px">' + S.esc(S.guard(q.title)) + '</strong> ' +
        '<span class="mono muted">' + S.esc(q.version || 'v1.0.0') + '</span></div>' +
        cMeta.rightBadge + '</div>' +

        '<div class="asset-meta">' +
        UI.avatar(creator, 22) +
        '<a href="#/u/' + S.esc(q.creatorUSN) + '" class="muted"><strong>@' + S.esc(q.creatorUSN) + '</strong></a>' +
        UI.roleBadge(authorRole) +
        UI.chip(q.category || q.showcaseType || q.board || 'General') +
        (q.license ? UI.chip(q.license) : '') +
        (q.tags || []).map(function (t) { return UI.chip(t); }).join('') +
        '<span class="muted">' + S.esc(UI.timeAgo(q.createdAt)) + '</span></div>' +

        '<div class="field"><span class="label">Submitted Content / Caption / Chronology</span>' +
        '<p class="muted" style="font-size:12.8px;white-space:pre-wrap;background:var(--obsidian);padding:10px 12px;border-radius:6px;border:1px solid var(--line-soft)">' +
        S.esc(S.guard(q.desc || q.caption || q.body || 'No description provided.')) + '</p></div>' +

        luauPreview +
        (q.state === 'review' ? lockBanner(q) : '') +

        '<div class="row wrap" style="margin-top:auto;padding-top:6px">' +
        (q.state === 'pending'
          ? '<button type="button" class="btn btn-sm btn-primary" data-inspect="' + S.esc(q.id) + '">' + UI.icon('lock', 14) + ' Lock & Inspect Submission</button>'
          : (q.reviewBy === me.usn
            ? '<button type="button" class="btn btn-sm btn-success" data-approve="' + S.esc(q.id) + '">' + UI.icon('check', 14) + ' ' + S.esc(cMeta.approveLabel) + '</button>' +
              '<button type="button" class="btn btn-sm btn-danger" data-reject="' + S.esc(q.id) + '">' + UI.icon('x', 14) + ' Reject Submission</button>'
            : '<span class="chip" style="opacity:.7">Locked by Staff @' + S.esc(q.reviewBy) + ' (Read-Only)</span>')) +
        (lockedByOther && RBAC.can(me.role, 'queue.forcerelease') ? '<button type="button" class="btn btn-sm btn-ghost" data-takeover="' + S.esc(q.id) + '">Force Override Lock</button>' : '') +
        '</div></div></div>';
    }

    function paintQueue() {
      const allItems = Store.list('queue').sort(function (a, b) { return a.createdAt - b.createdAt; });
      const items = filterState.channel === 'all'
        ? allItems
        : allItems.filter(function (q) { return (q.postType || 'market') === filterState.channel; });
      const pending = items.filter(function (q) { return q.state === 'pending'; });
      const locked = items.filter(function (q) { return q.state === 'review'; });

      const mktCount = allItems.filter(function (q) { return (q.postType || 'market') === 'market'; }).length;
      const shwCount = allItems.filter(function (q) { return q.postType === 'showcase'; }).length;
      const frmCount = allItems.filter(function (q) { return q.postType === 'forum'; }).length;

      const listEl = container.querySelector('#queue-dynamic-host');
      const countChip = container.querySelector('#queue-count-chip');
      if (countChip) countChip.textContent = pending.length + ' pending · ' + locked.length + ' under review';

      container.querySelectorAll('[data-q-tab]').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.qTab === filterState.channel);
      });
      const tabAll = container.querySelector('[data-q-tab="all"]');
      const tabMkt = container.querySelector('[data-q-tab="market"]');
      const tabShw = container.querySelector('[data-q-tab="showcase"]');
      const tabFrm = container.querySelector('[data-q-tab="forum"]');
      if (tabAll) tabAll.textContent = 'Semua Antrean (' + allItems.length + ')';
      if (tabMkt) tabMkt.textContent = '🛒 Marketplace (' + mktCount + ')';
      if (tabShw) tabShw.textContent = '🎨 Dashboard Showcase (' + shwCount + ')';
      if (tabFrm) tabFrm.textContent = '🔥 Forum Keluhan (' + frmCount + ')';

      listEl.innerHTML = items.length
        ? '<div class="queue-list">' +
          (locked.length ? '<h2 class="view-title" style="font-size:15px">' + UI.icon('lock', 16) + ' Active Staff Inspections</h2>' + locked.map(queueCard).join('') : '') +
          (pending.length ? '<h2 class="view-title" style="font-size:15px">' + UI.icon('clock', 16) + ' Awaiting Staff Lock</h2>' + pending.map(queueCard).join('') : '') +
          '</div>'
        : UI.emptyState('shieldCheck', 'Moderation queue is clear', 'Tidak ada antrean postingan (Marketplace, Dashboard Showcase, maupun Forum Keluhan) yang menunggu verifikasi.');

      UI.hydrateMedia(listEl);
    }

    container.innerHTML =
      '<div class="view">' +
      '<div class="view-head"><div><h1 class="view-title">' + UI.icon('shieldCheck', 22) + ' Shared Synchronized Moderation Queue</h1>' +
      '<p class="view-sub">Semua postingan dari Regular User, Moderator, maupun Owner (Marketplace Asset, Dashboard Showcase, & Forum Keluhan) wajib melewati antrean ini. Locking sets state to Under Review by Staff [' + S.esc(me.usn) + '].</p></div>' +
      '<span class="chip" id="queue-count-chip">0 pending · 0 under review</span></div>' +

      '<div class="tabs" id="queue-channel-tabs">' +
      '<button type="button" class="tab active" data-q-tab="all">Semua Antrean</button>' +
      '<button type="button" class="tab" data-q-tab="market">🛒 Marketplace</button>' +
      '<button type="button" class="tab" data-q-tab="showcase">🎨 Dashboard Showcase</button>' +
      '<button type="button" class="tab" data-q-tab="forum">🔥 Forum Keluhan</button>' +
      '</div>' +
      '<div id="queue-dynamic-host"></div>' +
      '</div>';

    container.querySelector('#queue-channel-tabs').addEventListener('click', function (e) {
      const t = e.target.closest('[data-q-tab]');
      if (!t) return;
      filterState.channel = t.dataset.qTab;
      paintQueue();
    });

    paintQueue();

    container.querySelector('.view').addEventListener('click', function (e) {
      const expandBtn = e.target.closest('[data-expand-media]');
      if (expandBtn) {
        const qItem = Store.get('queue', expandBtn.dataset.expandMedia);
        if (qItem) UI.inspectMediaModal(qItem);
        return;
      }
      const inspect = e.target.closest('[data-inspect]');
      const approve = e.target.closest('[data-approve]');
      const reject = e.target.closest('[data-reject]');
      const release = e.target.closest('[data-release]');
      const takeover = e.target.closest('[data-takeover]');

      if (inspect) {
        const id = inspect.dataset.inspect;
        const fresh = Store.get('queue', id);
        if (!fresh || fresh.state !== 'pending') {
          UI.toast('Submission was already locked by another staff member.', 'warn');
          paintQueue();
          return;
        }
        Store.update('queue', id, { state: 'review', reviewBy: me.usn, lockAt: Date.now() });
        Core.Audit.log(me.usn, 'QUEUE_LOCK', 'Under Review by Staff ' + me.usn + ' (' + id + ').');
        UI.toast('Locked for inspection: Under Review by Staff ' + me.usn, 'info');
        paintQueue();
      }
      if (release) {
        Store.update('queue', release.dataset.release, { state: 'pending', reviewBy: null, lockAt: null });
        Core.Audit.log(me.usn, 'QUEUE_RELEASE', 'Released review lock on ' + release.dataset.release + '.');
        paintQueue();
      }
      if (takeover) {
        Store.update('queue', takeover.dataset.takeover, { state: 'review', reviewBy: me.usn, lockAt: Date.now() });
        Core.Audit.log(me.usn, 'QUEUE_TAKEOVER', 'Assumed review lock of ' + takeover.dataset.takeover + '.');
        paintQueue();
      }
      if (approve) {
        const id = approve.dataset.approve;
        const q = Store.get('queue', id);
        if (!q || q.reviewBy !== me.usn) { UI.toast('Lock the item to your staff account before approving.', 'warn'); return; }
        const pType = q.postType || 'market';
        const confirmTitle = pType === 'showcase'
          ? 'Approve & Publish to Dashboard Showcase'
          : pType === 'forum'
            ? 'Approve & Publish to Forum Keluhan'
            : 'Approve & Sign into Marketplace';
        const confirmDesc = pType === 'showcase'
          ? 'Postingan Pamer Karya "' + q.title + '" oleh @' + q.creatorUSN + ' akan diterbitkan ke halaman utama Dashboard.'
          : pType === 'forum'
            ? 'Thread Keluhan "' + q.title + '" oleh @' + q.creatorUSN + ' akan diterbitkan ke halaman Forum Keluhan Roblox.'
            : '"' + q.title + '" will be cryptographically signed (SHA-256) and committed to the public marketplace.';

        UI.confirmDialog(confirmTitle, confirmDesc, 'Approve & Publish', false, async function () {
          if (pType === 'showcase') {
            Store.insert('showcases', {
              id: S.uuid('shw'),
              creatorUSN: q.creatorUSN,
              title: q.title,
              showcaseType: q.showcaseType || q.category || 'WIP Build / Map Flex',
              caption: q.caption || q.desc || '',
              media: q.media,
              likes: [],
              comments: [],
              approvedBy: me.usn,
              approvedAt: Date.now(),
              at: Date.now()
            });
            Store.remove('queue', id);
            Core.Audit.log(me.usn, 'SHOWCASE_APPROVED', 'Showcase "' + q.title + '" by @' + q.creatorUSN + ' approved and published to Dashboard.');
            UI.toast('Postingan Pamer Karya disetujui & kini tampil di Dashboard!', 'success');
          } else if (pType === 'forum') {
            Store.insert('forum', {
              id: S.uuid('trd'),
              title: q.title,
              board: q.board || q.category || CFG.FORUM_BOARDS[0],
              severity: q.severity || 'critical',
              body: q.body || q.desc || '',
              media: q.media,
              authorUSN: q.creatorUSN,
              upvotes: [q.creatorUSN],
              replies: [],
              approvedBy: me.usn,
              approvedAt: Date.now(),
              at: Date.now()
            });
            Store.remove('queue', id);
            Core.Audit.log(me.usn, 'FORUM_APPROVED', 'Forum thread "' + q.title + '" by @' + q.creatorUSN + ' approved and published to Forum.');
            UI.toast('Postingan Forum Keluhan disetujui & kini tampil di Forum!', 'success');
          } else {
            const assetId = S.uuid('ast');
            const signature = await S.sign(assetId, q.price, q.creatorUSN);
            Store.insert('market', {
              id: assetId,
              creatorUSN: q.creatorUSN,
              title: q.title,
              desc: q.desc,
              luauManifest: q.luauManifest || '',
              version: q.version || 'v1.0.0',
              license: q.license || 'Standard Commercial License',
              category: q.category,
              tags: (q.tags || []).slice(),
              price: Number(q.price),
              media: q.media,
              signature: signature,
              status: 'active',
              sales: 0,
              approvedAt: Date.now(),
              approvedBy: me.usn
            });
            Store.remove('queue', id);
            Core.Audit.log(me.usn, 'ASSET_APPROVED', '"' + q.title + '" signed (' + signature.slice(0, 12) + '…) and published.');
            UI.toast('Asset approved, signed, and published to the live marketplace!', 'success');
          }
          Modules.Main.render();
        });
      }
      if (reject) {
        const id = reject.dataset.reject;
        const q = Store.get('queue', id);
        if (!q || q.reviewBy !== me.usn) { UI.toast('Lock the item to your staff account before rejecting.', 'warn'); return; }
        UI.modal({
          title: 'Reject Submission — ' + S.guard(q.title),
          body: '<p class="muted">Select the mandatory structural rejection reason. The item and its binary media blob will be purged from queue state.</p>' +
            '<div class="field"><label class="label" for="rej-reason">Mandatory Rejection Reason</label>' +
            '<select class="select" id="rej-reason"><option value="">Select structural reason…</option>' +
            CFG.REJECT_REASONS.map(function (r) { return '<option value="' + S.esc(r) + '">' + S.esc(r) + '</option>'; }).join('') + '</select>' +
            '<div class="err hidden" id="rej-err">Please select a mandatory structural reason.</div></div>',
          actions: [
            { label: 'Cancel', cls: 'btn-ghost' },
            {
              label: 'Reject & Purge', cls: 'btn-danger', onClick: function (close, overlay) {
                const reason = overlay.querySelector('#rej-reason').value;
                if (!reason) { overlay.querySelector('#rej-err').classList.remove('hidden'); return; }
                (async function () {
                  if (q.media) await Core.Vault.remove(q.media.vaultId);
                  Store.remove('queue', id);
                  Core.Audit.log(me.usn, 'SUBMISSION_REJECTED', '"' + q.title + '" (' + (q.postType || 'market') + ') by @' + q.creatorUSN + ' rejected: ' + reason);
                  close();
                  UI.toast('Submission rejected (' + reason + ') and purged from queue.', 'success');
                  Modules.Main.render();
                })();
              }
            }
          ]
        });
      }
    });
  }

  /* ------------------------------------------------------ REPORTS ------- */
  function viewReports(container) {
    const UI = Modules.UI;
    const me = Modules.Auth.current();
    const open = Store.where('reports', function (r) { return r.state === 'open'; }).sort(function (a, b) { return b.at - a.at; });
    const resolved = Store.where('reports', function (r) { return r.state !== 'open'; }).sort(function (a, b) { return b.at - a.at; }).slice(0, 12);

    function targetSummary(r) {
      if (r.targetType === 'listing') {
        const m = Store.get('market', r.targetId);
        return m ? 'Listing "' + S.guard(m.title) + '"' : 'Listing (removed) ' + r.targetId.slice(-8);
      }
      if (r.targetType === 'user') return 'User @' + r.targetId;
      return 'Transaction ' + r.targetId.slice(-10);
    }
    function actionsFor(r) {
      if (r.targetType === 'listing') {
        return '<button class="btn btn-sm btn-danger" data-takedown="' + r.id + '">Takedown Listing</button>';
      }
      if (r.targetType === 'txn') {
        return '<button class="btn btn-sm btn-danger" data-arb-refund="' + r.id + '">Refund Buyer</button> ' +
          '<button class="btn btn-sm btn-success" data-arb-release="' + r.id + '">Release Payout</button>';
      }
      return '<button class="btn btn-sm btn-danger" data-flagtarget="' + r.id + '">Flag User</button>';
    }
    container.innerHTML =
      '<div class="view">' +
      '<div class="view-head"><div><h1 class="view-title">' + UI.icon('flag', 22) + ' Trust & Safety Reports</h1>' +
      '<p class="view-sub">Reported listings, flagged accounts, and escrow disputes awaiting staff action.</p></div>' +
      '<span class="chip">' + open.length + ' open</span></div>' +
      (open.length
        ? '<div class="table-wrap"><table class="table"><thead><tr><th>Target</th><th>Reason</th><th>Reporter</th><th>Submitted</th><th>Actions</th></tr></thead><tbody>' +
        open.map(function (r) {
          return '<tr><td><a href="' + (r.targetType === 'user' ? '#/u/' + S.esc(r.targetId) : (r.targetType === 'listing' ? '#/asset/' + S.esc(r.targetId) : '#/workspace')) + '">' + S.esc(targetSummary(r)) + '</a></td><td>' + S.esc(S.guard(r.reason)) + '</td><td><a href="#/u/' + S.esc(r.reporterUSN) + '">@' + S.esc(r.reporterUSN) + '</a></td>' +
            '<td class="muted">' + S.esc(UI.timeAgo(r.at)) + '</td>' +
            '<td>' + actionsFor(r) + ' <button class="btn btn-sm btn-ghost" data-dismiss="' + r.id + '">Dismiss</button></td></tr>';
        }).join('') + '</tbody></table></div>'
        : UI.emptyState('shieldCheck', 'No open reports', 'All community reports and escrow disputes have been resolved.')) +
      (resolved.length
        ? '<h2 class="view-title" style="font-size:15px;margin-top:8px">Recently Resolved</h2><div class="table-wrap"><table class="table"><thead><tr><th>Target</th><th>Reason</th><th>Outcome</th><th>Resolved</th></tr></thead><tbody>' +
        resolved.map(function (r) {
          return '<tr><td>' + S.esc(targetSummary(r)) + '</td><td>' + S.esc(S.guard(r.reason)) + '</td><td>' + UI.tonePill(r.state, r.state === 'dismissed' ? 'warn' : 'ok') + '</td><td class="muted">' + S.esc(UI.timeAgo(r.resolvedAt || r.at)) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '') +
      '</div>';

    container.querySelector('.view').addEventListener('click', function (e) {
      const dismiss = e.target.closest('[data-dismiss]');
      const takedown = e.target.closest('[data-takedown]');
      const flagtarget = e.target.closest('[data-flagtarget]');
      const arbRefund = e.target.closest('[data-arb-refund]');
      const arbRelease = e.target.closest('[data-arb-release]');
      function resolveReport(id, state) { Store.update('reports', id, { state: state, resolvedBy: me.usn, resolvedAt: Date.now() }); }
      if (dismiss) { resolveReport(dismiss.dataset.dismiss, 'dismissed'); UI.toast('Report dismissed.', 'success'); Modules.Main.render(); }
      if (takedown) {
        const rep = Store.get('reports', takedown.dataset.takedown);
        UI.confirmDialog('Takedown listing', 'The listing is removed from the marketplace and its media blob purged.', 'Takedown', true, async function () {
          if (rep) {
            const m = Store.get('market', rep.targetId);
            if (m && m.media) await Core.Vault.remove(m.media.vaultId);
            Store.remove('market', rep.targetId);
          }
          resolveReport(rep.id, 'actioned');
          Core.Audit.log(me.usn, 'LISTING_TAKEDOWN', 'Takedown executed for ' + rep.targetId + '.');
          UI.toast('Listing taken down.', 'success'); Modules.Main.render();
        });
      }
      if (flagtarget) {
        const rep = Store.get('reports', flagtarget.dataset.flagtarget);
        if (rep) {
          const u = Store.get('users', rep.targetId);
          if (u) Store.update('users', rep.targetId, { flags: (u.flags || []).concat([{ by: me.usn, reason: rep.reason, at: Date.now() }]) });
          resolveReport(rep.id, 'actioned');
          Core.Audit.log(me.usn, 'USER_FLAGGED', '@' + rep.targetId + ' flagged via report.');
          UI.toast('User flagged.', 'success'); Modules.Main.render();
        }
      }
      if (arbRefund) {
        const rep = Store.get('reports', arbRefund.dataset.arbRefund);
        if (rep) {
          const t = Store.get('txns', rep.targetId);
          Store.update('txns', rep.targetId, { state: 'refunded' });
          if (t) {
            const listing = Store.get('market', t.listingId);
            if (listing) Store.update('market', t.listingId, { status: 'active', sales: Math.max(0, listing.sales - 1) });
          }
          resolveReport(rep.id, 'actioned');
          Core.Audit.log(me.usn, 'DISPUTE_REFUND', 'Arbitration refunded ' + rep.targetId + '.');
          UI.toast('Dispute resolved: buyer refunded.', 'success'); Modules.Main.render();
        }
      }
      if (arbRelease) {
        const rep = Store.get('reports', arbRelease.dataset.arbRelease);
        if (rep) {
          Store.update('txns', rep.targetId, { state: 'completed', completedAt: Date.now() });
          resolveReport(rep.id, 'actioned');
          Core.Audit.log(me.usn, 'DISPUTE_RELEASE', 'Arbitration released payout for ' + rep.targetId + '.');
          UI.toast('Dispute resolved: payout released to seller.', 'success'); Modules.Main.render();
        }
      }
    });
  }

  /* ------------------------------------------------------ TICKETS ------- */
  function viewTickets(container) {
    const UI = Modules.UI;
    const me = Modules.Auth.current();
    const staffView = RBAC.can(me.role, 'tickets.view.all');
    const all = Store.list('tickets').sort(function (a, b) { return b.at - a.at; });
    const mine = all.filter(function (t) { return t.ownerUSN === me.usn; });
    const visible = staffView ? all : mine;

    container.innerHTML =
      '<div class="view" style="max-width:860px">' +
      '<div class="view-head"><div><h1 class="view-title">' + UI.icon('ticket', 22) + ' Support & Trouble Tickets</h1>' +
      '<p class="view-sub">' + (staffView ? 'Staff console: review and resolve creator support tickets.' : 'Direct support channel with platform moderators.') + '</p></div>' +
      '<button class="btn btn-primary" id="tk-new">' + UI.icon('pen', 15) + ' Open Ticket</button></div>' +
      (visible.length
        ? '<div class="col">' + visible.map(function (t) {
          return '<div class="card"><div class="card-head"><h3>' + S.esc(S.guard(t.subject)) + ' ' +
            UI.tonePill(t.state, t.state === 'open' ? 'info' : 'ok') + '</h3>' +
            '<span class="muted" style="font-size:11.5px">@' + S.esc(t.ownerUSN) + ' · ' + S.esc(UI.timeAgo(t.at)) + '</span></div>' +
            '<div class="card-body col"><div class="thread">' + t.messages.map(function (m) {
              const u = Store.get('users', m.by);
              const isStaff = u && u.role !== 'user' && u.role !== 'exclusive';
              return '<div class="thread-msg' + (isStaff ? ' staff' : '') + '"><span class="by">@' + S.esc(m.by) + '</span> · <span class="faint">' + S.esc(UI.timeAgo(m.at)) + '</span><br>' + S.esc(S.guard(m.body)) + '</div>';
            }).join('') + '</div>' +
            (t.state === 'open'
              ? '<div class="row wrap"><input class="input" style="flex:1;min-width:180px" placeholder="Write a reply…" data-reply-input="' + t.id + '" />' +
              '<button class="btn btn-sm btn-primary" data-reply="' + t.id + '">Reply</button>' +
              (staffView ? '<button class="btn btn-sm btn-success" data-resolve="' + t.id + '">Mark Resolved</button>' : '') + '</div>'
              : '') +
            '</div></div>';
        }).join('') + '</div>'
        : UI.emptyState('ticket', 'No active tickets', staffView ? 'No creator has opened a support ticket yet.' : 'You have no open support tickets.')) +
      '</div>';

    container.querySelector('#tk-new').addEventListener('click', function () {
      UI.modal({
        title: 'Open a Trouble Ticket',
        body: '<div class="field"><label class="label" for="tk-subject">Subject</label><input class="input" id="tk-subject" maxlength="90" placeholder="Short summary…" /></div>' +
          '<div class="field"><label class="label" for="tk-body">Details</label><textarea class="textarea" id="tk-body" placeholder="Include transaction UUIDs or listing IDs where relevant."></textarea></div>',
        actions: [
          { label: 'Cancel', cls: 'btn-ghost' },
          {
            label: 'Submit Ticket', cls: 'btn-primary', onClick: function (close, overlay) {
              const subjectScan = S.sanitize(overlay.querySelector('#tk-subject').value.trim());
              const bodyScan = S.sanitize(overlay.querySelector('#tk-body').value.trim());
              if (subjectScan.flags.length || bodyScan.flags.length) UI.toast('Restricted identifier pattern stripped from ticket.', 'warn');
              if (!subjectScan.clean) { UI.toast('Subject is required.', 'error'); return; }
              Store.insert('tickets', {
                id: S.uuid('tkt'), ownerUSN: me.usn, subject: subjectScan.clean.slice(0, 90),
                messages: [{ by: me.usn, body: bodyScan.clean.slice(0, 1200) || '(no details)', at: Date.now() }],
                state: 'open', at: Date.now()
              });
              Core.Audit.log(me.usn, 'TICKET_OPENED', subjectScan.clean.slice(0, 60));

  function viewCagm(container) {
    const UI = Modules.UI;
    const me = Modules.Auth.current();

    function refreshRoles() {
      const roles = CFG.VERIFIED_CODES[featureSel.value].roles;

    }
    refreshRoles();
    featureSel.addEventListener('change', refreshRoles);

    targetInput.addEventListener('input', function () {
      const usn = targetInput.value.trim().toLowerCase();
      if (!usn) { hint.textContent = 'Must match an existing creator account in local storage.'; hint.style.color = ''; return; }
      if (Store.get('users', usn)) { hint.textContent = '✔ Verified: @' + usn + ' exists in user database.'; hint.style.color = 'var(--green)'; }
      else { hint.textContent = '✘ No registered account matches @' + usn + '.'; hint.style.color = 'var(--red)'; }
    });

    container.querySelector('#cagm-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const targetUSN = targetInput.value.trim().toLowerCase().replace(/\s+/g, '');
      if (!Store.get('users', targetUSN)) { UI.toast('Target username does not exist in the user database.', 'error'); return; }
      let code = S.makeToken();
      while (Store.get('tokens', code)) code = S.makeToken();
      Store.insert('tokens', {
        code: code, feature: featureSel.value, role: roleSel.value, targetUSN: targetUSN,
        createdBy: me.usn, createdAt: Date.now(), status: 'active', redeemedBy: null, redeemedAt: null
      });
      Core.Audit.log(me.usn, 'TOKEN_MINTED', 'Minted ' + roleSel.value + ' token for @' + targetUSN + '.');
      const result = container.querySelector('#cg-result');
      result.classList.remove('hidden');
      result.innerHTML = '<div class="field"><label class="label">Minted Single-Use Access Token (Copy Now — Masked in Registry)</label>' +
        '<div class="copy-box"><span style="flex:1" id="cg-code-txt">' + S.esc(code) + '</span>' +
        '<button type="button" class="icon-btn" id="cg-copy" aria-label="Copy token">' + UI.icon('copy', 16) + '</button></div></div>';
      container.querySelector('#cg-copy').addEventListener('click', function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(function () { UI.toast('Token copied to clipboard.', 'success'); });
        } else {
          const range = document.createRange();
          range.selectNodeContents(container.querySelector('#cg-code-txt'));
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          document.execCommand('copy');
          UI.toast('Token copied to clipboard.', 'success');
        }
      });
      UI.toast('Access token minted for @' + targetUSN + '.', 'success');
    });
  }

  /* ------------------------------------- DISCREET TOKEN REDEMPTION ------ */
  function viewRedeem(container) {
    const UI = Modules.UI;
    const me = Modules.Auth.current();
    container.innerHTML =
      '<div class="view" style="max-width:600px">' +
      '<div class="view-head"><div><h1 class="view-title">' + UI.icon('padlockKey', 22) + ' Redeem Access Key</h1>' +
      '<p class="view-sub">Enter an authorized CAGM token to update account clearance.</p></div></div>' +
      '<form class="card" id="rd-form"><div class="card-body form">' +
      '<div class="field"><label class="label" for="rd-code">Cryptographic Access Token</label>' +
      '<input class="input mono" id="rd-code" type="password" placeholder="Enter authorized token…" autocomplete="off" required />' +
      '<span class="hint">Tokens are single-use and validated against the internal registry.</span></div>' +
      '<div class="row"><span class="chip">Active Clearance: ' + S.esc(RBAC.label(me.role)) + '</span>' + UI.roleBadge(me.role) + '</div>' +
      '<div class="err hidden" id="rd-err"></div>' +
      '<button type="submit" class="btn btn-primary">' + UI.icon('shieldCheck', 16) + ' Validate & Apply Clearance</button>' +
      '</div></form></div>';

    container.querySelector('#rd-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const errBox = container.querySelector('#rd-err');
      errBox.classList.add('hidden');
      const code = container.querySelector('#rd-code').value.trim();
      function fail(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); }

      const token = Store.get('tokens', code);
      if (!token) {
        S.logViolation(me.usn, 'INVALID_TOKEN_ATTEMPT', 'Failed token redemption attempt.');
        fail('Authorization failed: invalid or unrecognized access token.');
        return;
      }
      if (token.status !== 'active') { fail('This token is no longer active (' + token.status + ').'); return; }
      if (token.feature === 'GENESIS_BOOTSTRAP') {
        const ownerExists = Store.where('users', function (u) { return u.role === 'owner'; }).length > 0;
        if (ownerExists) { fail('Token is no longer valid.'); return; }
      } else if (token.targetUSN !== me.usn) {
        fail('This token is cryptographically bound to another username.');
        return;
      }
      if (RBAC.rank(token.role) <= RBAC.rank(me.role)) {
        fail('Your account already holds equal or higher clearance.');
        return;
      }

      const updatedUser = Store.update('users', me.usn, { role: token.role });
      Store.update('tokens', code, { status: 'redeemed', redeemedBy: me.usn, redeemedAt: Date.now() });
      /* Re-seal session with escalated role */
      if (updatedUser) Store.sessionSet(updatedUser.usn, updatedUser.passHash);
      Core.Audit.log(me.usn, 'TOKEN_REDEEMED', 'Clearance escalated to ' + token.role + '.');
      Store.voidGenesisIfOwnerExists();
      UI.toast('Clearance updated: you are now ' + CFG.ROLE_LABEL[token.role] + '.', 'success');
      Modules.Main.render();
    });
  }

  return Object.freeze({
    viewQueue: viewQueue,
    viewReports: viewReports,
    viewTickets: viewTickets,
    viewAdmin: viewAdmin,
    viewCagm: viewCagm,
    viewRedeem: viewRedeem
  });
});

'use strict';
/* ============================================================================
   RCP MAIN ROUTER & APPLICATION SHELL (v4.1 PRODUCTION READY)
   - Universal SPA link & [data-nav] click interceptor so every link, card,
     pill, and button opens reliably inside both browser tabs and Canvas iframes.
   - Zero stacked listeners on #viewport.
   ========================================================================== */
RCP._connect('Main', function (Core, Modules) {
  const CFG = Core.CONFIG;
  const S = Core.Security;
  const Store = Core.Store;
  const RBAC = Core.RBAC;

  let activePath = '/';
  let activeQuery = '';

  const ROUTES = [
    { path: '/', view: viewHome, guard: null },
    { path: '/auth', view: viewAuth, guard: null },
    { path: '/market', view: function (c) { Modules.Market.viewMarket(c); }, guard: null },
    { path: '/creators', view: function (c) { Modules.Creator.viewDirectory(c); }, guard: null },
    { path: '/forum', view: function (c) { Modules.Market.viewForum(c); }, guard: null },
    { path: '/asset/', view: function (c, arg) { Modules.Market.viewAsset(c, arg); }, guard: null },
    { path: '/u/', view: function (c, arg) { Modules.Creator.viewPublic(c, arg); }, guard: null },
    { path: '/submit', view: function (c) { Modules.Creator.viewSubmit(c); }, guard: 'auth' },
    { path: '/workspace', view: function (c) { Modules.Creator.viewWorkspace(c); }, guard: 'auth' },
    { path: '/profile', view: function (c) { Modules.Creator.viewProfile(c); }, guard: 'auth' },
    { path: '/redeem', view: function (c) { Modules.Staff.viewRedeem(c); }, guard: 'auth' },
    { path: '/tickets', view: function (c) { Modules.Staff.viewTickets(c); }, guard: 'auth' },
    { path: '/queue', view: function (c) { Modules.Staff.viewQueue(c); }, guard: 'queue.view' },
    { path: '/reports', view: function (c) { Modules.Staff.viewReports(c); }, guard: 'reports.view' },
    { path: '/admin', view: function (c) { Modules.Staff.viewAdmin(c); }, guard: 'admin.view' },
    { path: '/cagm', view: function (c) { Modules.Staff.viewCagm(c); }, guard: 'cagm.use' }
  ];

  function splitRouteAndQuery(rawTarget) {
    const cleaned = String(rawTarget || '/').replace(/^#/, '');
    const withSlash = cleaned.startsWith('/') ? cleaned : '/' + cleaned;
    const qIdx = withSlash.indexOf('?');
    if (qIdx === -1) return { path: withSlash, query: '' };
    return { path: withSlash.slice(0, qIdx), query: withSlash.slice(qIdx + 1) };
  }

  function syncFromLocationHash() {
    if (location.hash && location.hash.startsWith('#')) {
      const parsed = splitRouteAndQuery(location.hash.slice(1));
      activePath = parsed.path;
      activeQuery = parsed.query;
    }
  }

  function navigate(target) {
    const parsed = splitRouteAndQuery(target);
    activePath = parsed.path;
    activeQuery = parsed.query;
    const nextHash = '#' + activePath + (activeQuery ? '?' + activeQuery : '');
    try {
      if (location.hash !== nextHash) {
        history.pushState(null, '', nextHash);
      }
    } catch (err) {
      try { location.hash = nextHash; } catch (e2) { /* sandboxed iframe fallback */ }
    }
    render();
  }

  function resolve(path) {
    for (const route of ROUTES) {
      if (route.path.endsWith('/') && route.path !== '/') {
        if (path.startsWith(route.path) && path.length > route.path.length) {
          return { route: route, arg: decodeURIComponent(path.slice(route.path.length)) };
        }
      } else if (path === route.path) {
        return { route: route, arg: null };
      }
    }
    return { route: ROUTES[0], arg: null };
  }

  /* --------------------------------------------------------- HOME VIEW (DASHBOARD: PAMER KARYA / SHOWCASE FEED) -- */
  function viewHome(container) {
    const UI = Modules.UI;
    const me = Modules.Auth.current();
    const showcases = Store.list('showcases').sort(function (a, b) { return b.at - a.at; });
    const marketCount = Store.count('market', function (m) { return m.status === 'active'; });
    const forumCount = Store.count('forum');
    const creators = Store.count('users');
    const state = { type: '', q: '' };

    function renderShowcaseCards() {
      const freshShowcases = Store.list('showcases').sort(function (a, b) { return b.at - a.at; });
      let list = freshShowcases.slice();
      if (state.type) list = list.filter(function (s) { return s.showcaseType === state.type; });
      if (state.q) {
        const q = state.q.toLowerCase();
        list = list.filter(function (s) { return (s.title + ' ' + s.caption + ' ' + s.creatorUSN + ' ' + s.showcaseType).toLowerCase().includes(q); });
      }
      const host = container.querySelector('#home-market-grid');
      if (!freshShowcases.length) {
        host.innerHTML = UI.emptyState(
          'spark',
          'No active listings found. Start showcasing your work!',
          'Dashboard ini khusus untuk memposting dan pamer karya (WIP map, script demo, GFX, UI animasi) tanpa harus menjualnya. Yuk pamerkan karya pertamamu!',
          me
            ? '<button type="button" class="btn btn-primary" id="empty-post-showcase">' + UI.icon('camera', 15) + ' Posting & Pamer Karya Sekarang</button>'
            : '<a class="btn btn-primary" href="#/auth?mode=register">' + UI.icon('user', 15) + ' Buat Akun untuk Pamer Karya</a>'
        );
        const btn = host.querySelector('#empty-post-showcase');
        if (btn) btn.addEventListener('click', function () { Modules.Market.openShowcaseComposer(); });
        return;
      }
      if (!list.length) {
        host.innerHTML = UI.emptyState('search', 'Karya tidak ditemukan', 'Tidak ada postingan pamer karya yang cocok dengan filter saat ini.');
        return;
      }
      host.innerHTML = '<div class="showcase-grid">' + list.map(function (item) {
        const author = Store.get('users', item.creatorUSN);
        const likes = item.likes || [];
        const liked = me && likes.indexOf(me.usn) !== -1;
        const comments = item.comments || [];
        return '<article class="showcase-card" data-shw-id="' + S.esc(item.id) + '">' +
          UI.mediaNode(item.media, 'asset-media', true, item.id) +
          '<div class="showcase-body">' +
          '<div class="row between wrap">' + UI.chip(item.showcaseType || 'Showcase') +
          '<span class="faint" style="font-size:11.5px">' + S.esc(UI.timeAgo(item.at)) + '</span></div>' +
          '<strong style="font-size:15.5px;line-height:1.3">' + S.esc(S.guard(item.title)) + '</strong>' +
          (item.caption ? '<p class="showcase-caption">' + S.esc(S.guard(item.caption)) + '</p>' : '') +
          '<div class="row between wrap" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--line-soft)">' +
          '<a class="row" href="#/u/' + S.esc(item.creatorUSN) + '" style="color:inherit">' + UI.avatar(author, 24) +
          '<span class="mono">@' + S.esc(item.creatorUSN) + '</span></a>' +
          '<button type="button" class="like-btn' + (liked ? ' liked' : '') + '" data-like-shw="' + S.esc(item.id) + '">' +
          UI.icon('heart', 14) + ' <span>Apresiasi (' + likes.length + ')</span></button></div>' +
          UI.renderTikTokComments('showcases', item.id, item.creatorUSN, comments, me) +
          '</div></article>';
      }).join('') + '</div>';

      UI.hydrateMedia(host);
    }

    container.innerHTML =
      '<div class="view">' +
      '<div class="composer-banner">' +
      '<div><div class="row" style="gap:8px;margin-bottom:4px">' + UI.tonePill('DASHBOARD · PAMER KARYA & SHOWCASE', 'info') + '<span class="mono muted">Non-Commercial Portfolio Feed</span></div>' +
      '<h1 class="view-title">' + UI.icon('spark', 22) + ' Creator Showcase Wall — Pamer Karya & Portofolio</h1>' +
      '<p class="view-sub">Bagikan progres bangunan, efek visual, animasi UI, atau rekaman mekanik game kamu untuk dilihat komunitas. (Ingin menjual aset? Gunakan menu <strong>Marketplace</strong>. Ingin curhat/komplain soal Roblox? Buka <strong>Forum Keluhan</strong>).</p></div>' +
      '<div class="row wrap">' +
      (me
        ? '<button type="button" class="btn btn-primary" id="btn-open-showcase">' + UI.icon('camera', 16) + ' Posting / Pamer Karya</button>'
        : '<a class="btn btn-primary" href="#/auth?mode=register">' + UI.icon('user', 16) + ' Gabung & Pamer Karya</a>') +
      '</div></div>' +

      /* 3 Distinct Platform Pillars Navigation Cards */
      '<div class="grid-telemetry">' +
      '<div class="tele-card" data-nav="#/" style="border-color:rgba(0,132,255,0.45)"><span class="tele-num accent-b">' + showcases.length + '</span><span class="tele-label">🎨 Pamer Karya (Dashboard)</span></div>' +
      '<div class="tele-card" data-nav="#/market"><span class="tele-num accent-g">' + marketCount + '</span><span class="tele-label">🛒 Jual-Beli Aset (Marketplace) &rarr;</span></div>' +
      '<div class="tele-card" data-nav="#/forum"><span class="tele-num accent-a">' + forumCount + '</span><span class="tele-label">🔥 Keluhan Roblox (Forum) &rarr;</span></div>' +
      '<div class="tele-card" data-nav="#/creators"><span class="tele-num">' + creators + '</span><span class="tele-label">👥 Direktori Kreator &rarr;</span></div>' +
      '</div>' +

      (function () {
        const qShowcases = Store.count('queue', function (q) { return q.postType === 'showcase'; });
        const qTotal = Store.count('queue');
        const canMod = me && RBAC.can(me.role, 'queue.view');
        if (!qTotal) return '';
        return '<div class="queue-pending-strip">' +
          '<div class="row" style="gap:8px">' + UI.icon('clock', 16) +
          '<span><strong>Antrean Moderasi Aktif:</strong> ' + qShowcases + ' Pamer Karya Dashboard (Total ' + qTotal + ' postingan di Queue dari User/Moderator/Owner) menunggu verifikasi.</span></div>' +
          (canMod
            ? '<a class="btn btn-sm btn-primary" href="#/queue">' + UI.icon('shieldCheck', 14) + ' Buka Mod Queue & Verifikasi (' + qTotal + ')</a>'
            : (me ? '<a class="btn btn-sm btn-ghost" href="#/workspace">Cek Status Postingan Saya</a>' : '')) +
          '</div>';
      })() +
      '<div class="filters">' +
      '<input class="input search" id="shw-q" placeholder="Cari judul pamer karya, @kreator, atau deskripsi…" />' +
      '<select class="select" id="shw-type"><option value="">Semua Jenis Karya</option>' +
      CFG.SHOWCASE_TYPES.map(function (t) { return '<option value="' + S.esc(t) + '">' + S.esc(t) + '</option>'; }).join('') + '</select>' +
      '</div>' +

      '<div id="home-market-grid"></div>' +

      '<div class="handbook">' + CFG.HANDBOOK.map(function (h, idx) {
        return '<div class="hand-card" data-handbook="' + idx + '" title="Click to inspect technical specification"><h4>' + UI.icon(h.icon, 16) + S.esc(h.title) + '</h4><p>' + S.esc(h.body) + '</p></div>';
      }).join('') + '</div>' +
      footerNote() + '</div>';

    const postBtn = container.querySelector('#btn-open-showcase');
    if (postBtn) postBtn.addEventListener('click', function () { Modules.Market.openShowcaseComposer(); });

    container.querySelector('#shw-q').addEventListener('input', function (e) { state.q = e.target.value.trim(); renderShowcaseCards(); });
    container.querySelector('#shw-type').addEventListener('change', function (e) { state.type = e.target.value; renderShowcaseCards(); });

    const wallHost = container.querySelector('#home-market-grid');
    wallHost.addEventListener('click', function (e) {
      const expandBtn = e.target.closest('[data-expand-media]');
      if (expandBtn) {
        const shw = Store.get('showcases', expandBtn.dataset.expandMedia);
        if (shw) {
          UI.inspectMediaModal({
            title: shw.title,
            creatorUSN: shw.creatorUSN,
            category: shw.showcaseType,
            version: 'Showcase Only',
            license: 'Portfolio Display (Not for Sale)',
            price: 0,
            desc: shw.caption,
            media: shw.media
          });
        }
        return;
      }
      const likeBtn = e.target.closest('[data-like-shw]');
      if (likeBtn) {
        if (!me) { UI.toast('Sign in untuk memberi apresiasi karya.', 'warn'); navigate('/auth'); return; }
        const id = likeBtn.dataset.likeShw;
        const shw = Store.get('showcases', id);
        if (!shw) return;
        const likes = (shw.likes || []).slice();
        const idx = likes.indexOf(me.usn);
        if (idx === -1) likes.push(me.usn); else likes.splice(idx, 1);
        Store.update('showcases', id, { likes: likes });
        renderShowcaseCards();
        return;
      }
      const cmtBtn = e.target.closest('[data-shw-comment]');
      if (cmtBtn && me) {
        const id = cmtBtn.dataset.shwComment;
        const inp = wallHost.querySelector('[data-shw-input="' + id + '"]');
        const scan = S.sanitize(inp.value.trim());
        if (!scan.clean) return;
        if (scan.flags.length) UI.toast('Restricted identifier pattern stripped.', 'warn');
        const shw = Store.get('showcases', id);
        if (!shw) return;
        const comments = (shw.comments || []).concat([{ by: me.usn, text: scan.clean.slice(0, 500), at: Date.now() }]);
        Store.update('showcases', id, { comments: comments });
        UI.toast('Komentar apresiasi ditambahkan.', 'success');
        renderShowcaseCards();
      }
    });

    UI.wireTikTokComments(wallHost, renderShowcaseCards);
    renderShowcaseCards();
  }

  function footerNote() {
    const UI = Modules.UI;
    return '<div class="footer-note"><span>' + UI.logo(18) + '</span>' +
      '<span>' + S.esc(CFG.APP_NAME) + ' v' + S.esc(CFG.VERSION) + '</span>' +
      '<span>Persistence: ' + (Store.isDegraded() ? 'Volatile Memory Fallback' : 'Sealed localStorage + IndexedDB Media Vault') + '</span>' +
      '<span>Architecture: 100% Client-Side ES6+ Closure Engine</span>' +
      '<span class="spacer"></span><span>© 2026 RCP Global</span></div>';
  }

  /* --------------------------------------------------------- AUTH VIEW -- */
  function viewAuth(container) {
    const UI = Modules.UI;
    if (Modules.Auth.current()) { navigate('/'); return; }
    const initMode = activeQuery.indexOf('mode=register') !== -1 ? 'register' : 'login';

    container.innerHTML =
      '<div class="view" style="max-width:460px;margin-top:24px">' +
      '<div class="row" style="justify-content:center;gap:12px">' + UI.logo(46) +
      '<div><h1 style="font-size:20px;font-weight:800">Creator Portal Access</h1><p class="muted" style="font-size:12.5px">100% client-side authentication with anti-impersonation guard.</p></div></div>' +
      '<div class="segmented" id="au-tabs" style="align-self:center">' +
      '<button type="button" class="seg-btn' + (initMode === 'login' ? ' active' : '') + '" data-mode="login">Sign In</button>' +
      '<button type="button" class="seg-btn' + (initMode === 'register' ? ' active' : '') + '" data-mode="register">Register Creator Account</button></div>' +
      '<form class="card" id="au-form"><div class="card-body form">' +
      '<div class="field"><label class="label" for="au-usn">Username (USN — lowercase alphanumeric & underscores)</label>' +
      '<input class="input mono" id="au-usn" autocomplete="username" placeholder="e.g. nexus_builder" required /></div>' +
      '<div class="field"><label class="label" for="au-pass">Password</label>' +
      '<input class="input" id="au-pass" type="password" autocomplete="current-password" placeholder="••••••••" required /></div>' +
      '<div class="field' + (initMode === 'register' ? '' : ' hidden') + '" id="au-pass2-wrap"><label class="label" for="au-pass2">Confirm Password</label>' +
      '<input class="input" id="au-pass2" type="password" autocomplete="new-password" placeholder="8+ chars, 1 letter & 1 number" /></div>' +
      '<div class="field' + (initMode === 'register' ? '' : ' hidden') + '" id="au-rbx-wrap"><label class="label" for="au-rbx">Roblox Account Username</label>' +
      '<input class="input" id="au-rbx" placeholder="Exact Roblox username for live headshot sync" autocomplete="off" />' +
      '<span class="hint">Avatars are fetched dynamically from the official Roblox Headshot API. Local avatar file uploads are disabled.</span></div>' +
      '<div class="err hidden" id="au-err"></div>' +
      '<button type="submit" class="btn btn-primary btn-block" id="au-submit">' + (initMode === 'login' ? 'Sign In' : 'Create Creator Account') + '</button>' +
      '</div></form></div>';

    let mode = initMode;
    const tabs = container.querySelector('#au-tabs');
    const errBox = container.querySelector('#au-err');
    function setMode(next) {
      mode = next;
      tabs.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.mode === mode); });
      container.querySelector('#au-pass2-wrap').classList.toggle('hidden', mode !== 'register');
      container.querySelector('#au-rbx-wrap').classList.toggle('hidden', mode !== 'register');
      container.querySelector('#au-submit').textContent = mode === 'login' ? 'Sign In' : 'Create Creator Account';
      errBox.classList.add('hidden');
    }
    tabs.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-mode]');
      if (btn) setMode(btn.dataset.mode);
    });

    container.querySelector('#au-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.classList.add('hidden');
      const submitBtn = container.querySelector('#au-submit');
      submitBtn.disabled = true;
      try {
        if (mode === 'login') {
          Modules.Auth.login(container.querySelector('#au-usn').value, container.querySelector('#au-pass').value);
          UI.toast('Authenticated session sealed.', 'success');
          navigate('/');
        } else {
          await Modules.Auth.register({
            usn: container.querySelector('#au-usn').value,
            pass: container.querySelector('#au-pass').value,
            pass2: container.querySelector('#au-pass2').value,
            robloxName: container.querySelector('#au-rbx').value
          });
          UI.toast('Creator account created and Roblox headshot synced.', 'success');
          navigate('/');
        }
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
        submitBtn.disabled = false;
      }
    });
  }

  /* ---------------------------------------------- NAVIGATION & SHELL ----- */
  function navItems(me) {
    const items = [];
    items.push({ href: '#/', icon: 'spark', label: 'Dashboard (Pamer Karya)', key: '/', count: Store.count('showcases') });
    items.push({ href: '#/market', icon: 'bag', label: 'Marketplace (Jual Aset)', key: '/market', count: Store.count('market', function (m) { return m.status === 'active'; }) });
    items.push({ href: '#/forum', icon: 'flame', label: 'Forum (Keluhan Roblox)', key: '/forum', count: Store.count('forum') });
    items.push({ href: '#/creators', icon: 'users', label: 'Creator Directory', key: '/creators', count: Store.count('users') });
    if (me) {
      items.push({ section: 'Creator Studio' });
      items.push({ href: '#/submit', icon: 'contractPen', label: 'Jual Aset Baru', key: '/submit' });
      items.push({ href: '#/workspace', icon: 'grid', label: 'Workspace', key: '/workspace' });
      items.push({ href: '#/profile', icon: 'user', label: 'My Profile', key: '/profile' });
      items.push({ href: '#/tickets', icon: 'ticket', label: 'Support Tickets', key: '/tickets' });
      items.push({ href: '#/redeem', icon: 'padlockKey', label: 'Redeem Key', key: '/redeem' });
    }
    if (me && RBAC.can(me.role, 'queue.view')) {
      const pending = Store.count('queue');
      items.push({ section: 'Staff Console' });
      items.push({ href: '#/queue', icon: 'shieldCheck', label: 'Mod Queue', key: '/queue', count: pending });
      items.push({ href: '#/reports', icon: 'flag', label: 'Reports & Disputes', key: '/reports', count: Store.count('reports', function (r) { return r.state === 'open'; }) });
    }
    if (me && RBAC.can(me.role, 'admin.view')) {
      items.push({ href: '#/admin', icon: 'chart', label: 'Executive Console', key: '/admin' });
    }
    if (me && RBAC.can(me.role, 'cagm.use')) {
      items.push({ href: '#/cagm', icon: 'padlockKey', label: 'Owner CAGM', key: '/cagm' });
    }
    return items;
  }

  function renderShell() {
    const UI = Modules.UI;
    const me = Modules.Auth.current();
    const topbar = document.getElementById('topbar');
    topbar.innerHTML =
      '<button type="button" class="icon-btn" id="side-toggle" aria-label="Toggle sidebar">' + UI.icon('menu', 20) + '</button>' +
      '<a class="brand" href="#/">' + UI.logo(36) +
      '<span class="brand-name">RCP<small>Roblox Creator Platform</small></span></a>' +
      '<div class="topbar-quicksearch">' +
      '<span class="qs-icon">' + UI.icon('search', 15) + '</span>' +
      '<input type="search" id="top-quick-search" placeholder="Quick search verified marketplace assets…" aria-label="Quick search marketplace" />' +
      '</div>' +
      '<span class="spacer"></span>' +
      (me
        ? '<span data-nav="#/profile" title="Edit workflow availability">' + UI.statusPill(me.status) + '</span>' +
          '<a class="session-chip" href="#/profile">' + UI.avatar(me, 30) +
          '<span class="who">' + S.esc(S.guard(me.displayName)) + '<br><span class="muted" style="font-weight:500">@' + S.esc(me.usn) + '</span></span>' +
          UI.roleBadge(me.role) + '</a>' +
          '<button type="button" class="icon-btn logout-red" id="logout-btn" aria-label="Sign out" title="Sign out">' + UI.icon('doorExitRed', 19) + '</button>'
        : '<a class="btn btn-ghost btn-sm" href="#/auth?mode=login">Sign In</a><a class="btn btn-primary btn-sm" href="#/auth?mode=register">Register</a>');

    const qsInput = document.getElementById('top-quick-search');
    if (qsInput) {
      qsInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && qsInput.value.trim()) {
          const q = qsInput.value.trim();
          activePath = '/market';
          activeQuery = '';
          renderShell();
          const viewport = document.getElementById('viewport');
          Modules.Market.viewMarket(viewport, q);
        }
      });
    }

    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = navItems(me).map(function (it) {
      if (it.section) return '<div class="side-section">' + S.esc(it.section) + '</div>';
      const active = activePath === it.key || (it.key !== '/' && activePath.startsWith(it.key));
      return '<a class="side-link' + (active ? ' active' : '') + '" href="' + it.href + '">' +
        UI.icon(it.icon, 18) + '<span class="txt">' + S.esc(it.label) + '</span>' +
        (it.count ? '<span class="count">' + it.count + '</span>' : '') + '</a>';
    }).join('') +
      '<div class="side-foot"><button type="button" class="btn btn-ghost btn-sm btn-block" id="side-collapse">' +
      UI.icon('chevron', 15) + '<span class="foot-txt">Collapse Sidebar</span></button></div>';

    document.getElementById('side-toggle').addEventListener('click', function () {
      document.body.classList.toggle('side-open');
      const scrim = document.getElementById('scrim');
      scrim.hidden = !document.body.classList.contains('side-open');
    });
    document.getElementById('side-collapse').addEventListener('click', function () {
      const mini = document.body.dataset.side === 'mini';
      document.body.dataset.side = mini ? 'full' : 'mini';
      try { localStorage.setItem(CFG.KEYS.uipref, document.body.dataset.side); } catch (err) { /* ignore */ }
    });
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function () {
        Modules.Auth.logout();
        UI.toast('Signed out safely.', 'info');
        navigate('/');
      });
    }
  }

  function render() {
    const UI = Modules.UI;
    renderShell();
    const viewport = document.getElementById('viewport');
    const resolved = resolve(activePath);
    const me = Modules.Auth.current();
    const guard = resolved.route.guard;
    if (guard === 'auth' && !me) {
      UI.toast('Sign in to access that workspace.', 'warn');
      activePath = '/auth';
      activeQuery = 'mode=login';
      renderShell();
      viewAuth(viewport);
      return;
    }
    if (guard && guard !== 'auth') {
      if (!me || !RBAC.can(me.role, guard)) {
        UI.toast('Access denied: insufficient role clearance.', 'error');
        activePath = '/';
        activeQuery = '';
        renderShell();
        viewHome(viewport);
        return;
      }
    }
    viewport.innerHTML = '';
    try {
      resolved.route.view(viewport, resolved.arg);
    } catch (err) {
      viewport.innerHTML = UI.emptyState('alert', 'Render fault contained', 'The view recovered safely: ' + err.message);
    }
    document.body.classList.remove('side-open');
    document.getElementById('scrim').hidden = true;
    viewport.focus({ preventScroll: true });
  }

  async function boot() {
    const UI = Modules.UI;
    await Core.Vault.open();
    Store.ensureGenesis();
    Store.voidGenesisIfOwnerExists();
    syncFromLocationHash();

    try {
      const pref = localStorage.getItem(CFG.KEYS.uipref);
      if (pref === 'mini' && window.matchMedia('(min-width: 961px)').matches) document.body.dataset.side = 'mini';
    } catch (err) { /* ignore */ }

    document.getElementById('scrim').addEventListener('click', function () {
      document.body.classList.remove('side-open');
      document.getElementById('scrim').hidden = true;
    });

    /* Universal SPA Click Interceptor:
       Guarantees every `<a href="#/...">`, `[data-nav="#/..."]`, and `[data-handbook]`
       opens immediately even inside strict sandboxed Canvas iframes! */
    document.addEventListener('click', function (e) {
      const hb = e.target.closest('[data-handbook]');
      if (hb) {
        const idx = Number(hb.dataset.handbook);
        const item = CFG.HANDBOOK[idx];
        if (item) {
          UI.modal({
            title: item.title,
            body: '<p class="muted">' + S.esc(item.body) + '</p>' +
              '<div class="row wrap" style="margin-top:8px">' +
              UI.chip('100% Client-Side ES6+') +
              UI.chip('Zero External Cloud') +
              UI.chip('SHA-256 Verified') +
              '</div>',
            actions: [{ label: 'Close', cls: 'btn-primary' }]
          });
        }
        return;
      }

      const navCard = e.target.closest('[data-nav]');
      if (navCard) {
        e.preventDefault();
        navigate(navCard.dataset.nav);
        return;
      }

      const anchor = e.target.closest('a[href]');
      if (anchor) {
        const href = anchor.getAttribute('href') || '';
        if (href.startsWith('#/') || href === '#') {
          e.preventDefault();
          navigate(href === '#' ? '/' : href.slice(1));
        }
      }
    });

    document.addEventListener('error', function (e) {
      const t = e.target;
      if (t && t.tagName === 'IMG' && t.classList.contains('avatar') && !t.dataset.fbk) {
        t.dataset.fbk = '1';
        t.src = UI.identicon(t.dataset.usn || 'rcp');
      }
    }, true);

    window.addEventListener('storage', function () { render(); });
    window.addEventListener('hashchange', function () {
      syncFromLocationHash();
      render();
    });
    window.addEventListener('popstate', function () {
      syncFromLocationHash();
      render();
    });
    window.addEventListener('error', function (e) {
      if (e && e.message) UI.toast('Runtime fault contained: ' + e.message, 'error');
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (e && e.reason && e.reason.message) UI.toast('Async fault contained: ' + e.reason.message, 'error');
    });

    const splash = document.getElementById('splash');
    if (splash) {
      document.getElementById('splash-mark').innerHTML = UI.logo(64);
      splash.classList.add('gone');
      setTimeout(function () { splash.remove(); }, 280);
    }
    render();
  }

  document.addEventListener('DOMContentLoaded', function () { boot(); });
  return Object.freeze({ boot: boot, render: render, view: render, navigate: navigate });
});

  </script>
