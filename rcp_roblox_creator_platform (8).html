  function drawHexRobuxIcon(ctx, cx, cy, radius, fillHex, holeHex, outerStrokeHex) {
    ctx.save();
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI / 3) * i - Math.PI / 6;
      const vx = cx + radius * Math.cos(angle);
      const vy = cy + radius * Math.sin(angle);
      if (i === 0) ctx.moveTo(vx, vy);
      else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fillStyle = fillHex || '#00E676';
    ctx.fill();
    if (outerStrokeHex) {
      ctx.lineWidth = Math.max(1.5, radius * 0.14);
      ctx.strokeStyle = outerStrokeHex;
      ctx.stroke();
    }

    const holeR = Math.max(3, Math.round(radius * 0.38));
    ctx.fillStyle = holeHex || '#191B1D';
    ctx.fillRect(cx - holeR, cy - holeR, holeR * 2, holeR * 2);
    ctx.restore();
  }

  function generateDemoRobuxScreenshotBlob(kind, nominalAmount, robloxUsername) {
    return new Promise(function (resolve) {
      const amt = Math.max(100, parseRobuxNominalInput(nominalAmount) || 38700);
      const abbrev = formatRobuxAbbrev(amt);

      if (kind === 'balance_pill') {
        const canvas = document.createElement('canvas');
        canvas.width = 420;
        canvas.height = 320;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#BCC0C6';
        ctx.fillRect(0, 0, 420, 320);

        const px = 28, py = 62, pw = 364, ph = 142, pr = 42;
        ctx.beginPath();
        ctx.moveTo(px + pr, py);
        ctx.lineTo(px + pw - pr, py);
        ctx.quadraticCurveTo(px + pw, py, px + pw, py + pr);
        ctx.lineTo(px + pw, py + ph - pr);
        ctx.quadraticCurveTo(px + pw, py + ph, px + pw - pr, py + ph);
        ctx.lineTo(px + pr, py + ph);
        ctx.quadraticCurveTo(px, py + ph, px, py + ph - pr);
        ctx.lineTo(px, py + pr);
        ctx.quadraticCurveTo(px, py, px + pr, py);
        ctx.closePath();
        ctx.fillStyle = '#F6F7F8';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#E1E4E8';
        ctx.stroke();

  function wireProfile(container, me) {
    const UI = Modules.UI;
    const state = {
      tags: (me.tags || []).slice(),
      status: me.status,
      accent: (me.style && me.style.accent) || CFG.ACCENTS[0],
      pattern: (me.style && me.style.pattern) || 'grid'

    const displayInput = container.querySelector('#pf-display');
    const bioInput = container.querySelector('#pf-bio');
    const displayCount = container.querySelector('#pf-display-count');
    const bioCount = container.querySelector('#pf-bio-count');
    const errBox = container.querySelector('#pf-err');

    function refreshCounters() {
      displayCount.textContent = UI.charCount(displayInput.value, CFG.LIMITS.displayNameMax);
      bioCount.textContent = UI.charCount(bioInput.value, CFG.LIMITS.bioMax);

    refreshCounters();
    displayInput.addEventListener('input', refreshCounters);
    bioInput.addEventListener('input', refreshCounters);

    container.querySelector('#pf-tags').addEventListener('click', function (e) {
      const btn = e.target.closest('[data-tag]');
      if (!btn) return;
      const tag = btn.dataset.tag;
      const idx = state.tags.indexOf(tag);
      if (idx === -1) state.tags.push(tag); else state.tags.splice(idx, 1);
      btn.classList.toggle('active');
    });

    container.querySelector('#pf-status').addEventListener('click', function (e) {
      const btn = e.target.closest('[data-status]');
      if (!btn) return;
      state.status = btn.dataset.status;
      container.querySelectorAll('#pf-status .seg-btn').forEach(function (b) { b.classList.toggle('active', b === btn); });
      Store.update('users', me.usn, { status: state.status });
      Core.Audit.log(me.usn, 'STATUS_CHANGE', 'Workflow status changed to ' + state.status + '.');
      UI.toast('Workflow status updated: ' + CFG.STATUS[state.status].emoji + ' ' + CFG.STATUS[state.status].label, 'success');
      Modules.Main.render();
    });

    container.querySelector('#pf-accent').addEventListener('click', function (e) {
      const sw = e.target.closest('[data-accent]');
      if (!sw) return;
      state.accent = sw.dataset.accent;
      container.querySelectorAll('#pf-accent .swatch').forEach(function (b) { b.classList.toggle('active', b === sw); });
    });

    container.querySelector('#resync-avatar').addEventListener('click', async function (e) {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.innerHTML = UI.icon('refresh', 15) + ' Syncing…';
      const updated = await Modules.Auth.syncAvatar(me.usn);
      btn.disabled = false;
      if (updated && updated.avatarSync === 'live') UI.toast('Roblox headshot synchronized from live endpoint.', 'success');
      else UI.toast('Roblox headshot endpoint synced via deterministic fallback.', 'info');
      Modules.Main.render();
    });

    container.querySelector('#profile-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.classList.add('hidden');
      const problems = [];
      const displayScan = S.sanitize(displayInput.value.trim());
      const bioScan = S.sanitize(bioInput.value.trim());
      const headlineScan = S.sanitize(container.querySelector('#pf-headline').value.trim());
      const rbxInput = container.querySelector('#pf-roblox').value.trim();
      const rbxScan = S.sanitize(rbxInput);

      if (rbxScan.flags.length) {
        S.logViolation(me.usn, 'GOV_ID_BLOCKED', 'Profile Roblox username contained restricted government ID.');
        errBox.textContent = 'Restricted government ID detected in Roblox account field.';
        errBox.classList.remove('hidden');
        return;
      }
      if (bioScan.flags.length || displayScan.flags.length || headlineScan.flags.length) {
        UI.toast('Restricted government identifier redacted automatically.', 'warn');
        S.logViolation(me.usn, 'PII_REDACTED', 'Profile fields contained restricted identifier structure.');
      }

      const displayName = displayScan.clean;
      const len = Array.from(displayName).length;
      if (len < 1 || len > CFG.LIMITS.displayNameMax) {
        problems.push('Display Name must be 1–' + CFG.LIMITS.displayNameMax + ' characters (currently ' + len + ').');

      if (problems.length) {
        errBox.textContent = problems.join(' ');

        creatorTier: derivedTier,

        tags: state.tags,
        paymentMethod: paymentMethod,
        commission: { minPrice: minPrice, turnaround: turnaround },
        style: { accent: state.accent, pattern: state.pattern }

    function syncTierTelemetryFromSelect() {
      if (!rssTierSelect) return;

    function drawPreviewOnCanvas(file, logoReticle, ocrOverlay) {
      if (!file || !rssScanCanvas) return;
      const u = URL.createObjectURL(file);
      const im = new Image();
      im.onload = function () {
        URL.revokeObjectURL(u);
        rssScanCanvas.width = im.naturalWidth || 420;
        rssScanCanvas.height = im.naturalHeight || 320;
        const cctx = rssScanCanvas.getContext('2d');
        cctx.drawImage(im, 0, 0);

        /* 1. Draw Hexagonal Robux Logo Reticle */
        if (logoReticle && logoReticle.x != null) {
          const rx = logoReticle.x * rssScanCanvas.width;
          const ry = logoReticle.y * rssScanCanvas.height;
          const boxHalf = Math.max(22, Math.round(Math.min(rssScanCanvas.width, rssScanCanvas.height) * 0.11));
          cctx.save();
          cctx.strokeStyle = '#00E676';
          cctx.lineWidth = 3;
          cctx.strokeRect(rx - boxHalf, ry - boxHalf, boxHalf * 2, boxHalf * 2);
          cctx.fillStyle = 'rgba(10, 14, 18, 0.88)';
          cctx.fillRect(Math.max(4, rx - boxHalf), Math.max(4, ry - boxHalf - 22), 142, 20);
          cctx.fillStyle = '#00E676';
          cctx.font = 'bold 11.5px monospace';
          cctx.fillText('✔ LOGO ROBUX HEX', Math.max(8, rx - boxHalf + 5), Math.max(18, ry - boxHalf - 8));
          cctx.restore();
        }

        /* 2. Draw OCR Extracted Text Bounding Box & Match Verdict */
        if (ocrOverlay && ocrOverlay.ocrResult && ocrOverlay.ocrResult.found && ocrOverlay.ocrResult.box) {
          const b = ocrOverlay.ocrResult.box;
          const isMatch = Boolean(ocrOverlay.exactNominalMatch);
          const color = isMatch ? '#00E676' : '#FF4757';
          const pad = 6;
          const bx = Math.max(2, b.x0 - pad);
          const by = Math.max(2, b.y0 - pad);
          const bw = Math.min(rssScanCanvas.width - bx - 2, (b.x1 - b.x0) + pad * 2);
          const bh = Math.min(rssScanCanvas.height - by - 2, (b.y1 - b.y0) + pad * 2);

          cctx.save();
          cctx.strokeStyle = color;
          cctx.lineWidth = 3;
          cctx.strokeRect(bx, by, bw, bh);

          const tagText = isMatch
            ? '✔ OCR: "' + ocrOverlay.ocrResult.text + '" (' + ocrOverlay.ocrResult.amount.toLocaleString() + ' R$) == INPUT'
            : '✘ OCR: "' + ocrOverlay.ocrResult.text + '" (' + ocrOverlay.ocrResult.amount.toLocaleString() + ') ≠ ' + Number(ocrOverlay.claimedAmount || 0).toLocaleString();
          const tagW = Math.min(rssScanCanvas.width - 8, Math.max(170, tagText.length * 7.2));
          const tagX = Math.max(4, Math.min(bx, rssScanCanvas.width - tagW - 4));
          const tagY = (by + bh + 24 < rssScanCanvas.height) ? (by + bh + 4) : Math.max(4, by - 24);

          cctx.fillStyle = 'rgba(10, 14, 18, 0.92)';
          cctx.fillRect(tagX, tagY, tagW, 20);
          cctx.fillStyle = color;
          cctx.font = 'bold 11px monospace';
          cctx.fillText(tagText, tagX + 6, tagY + 14);
          cctx.restore();
        }
      };
      im.src = u;
    }

    function loadProofFile(file) {
      if (!file) return;
      selectedProofFile = file;
      rssFileLabel.textContent = file.name + ' · ' + UI.fmtBytes(file.size) + ' (Privat / Siap Dipindai AI)';

        if (rssTierSelect) {
          rssTierSelect.value = 'sedang';
          syncTierTelemetryFromSelect();
        }
        rssAmountInput.value = '38699';
        rssSourceSelect.selectedIndex = 0;
        rssOriginSelect.value = 'earned';
        rssGiftCodeInput.value = '';
        const demoFile = await generateDemoRobuxScreenshotBlob('balance_pill', 38700, me.robloxName || me.usn);
        loadProofFile(demoFile);
        UI.toast('Skenario 2 siap: Foto berisi "38.7K" (38.700 R$) tetapi Input diisi 38699. Klik Mulai Pemindaian untuk melihat penolakan OCR!', 'warn');
      });
    }

    /* Scenario 3: High Robux Claim (15,000 R$) WITH Valid Gift / Redeem Voucher Evidence (Passes even for Pemula!) */
    if (rssGenGift) {
      rssGenGift.addEventListener('click', async function () {
        if (rssTierSelect) {
          rssTierSelect.value = 'pemula';
          syncTierTelemetryFromSelect();
        }
        const giftAmt = 15000;
        rssAmountInput.value = '15000';
        rssOriginSelect.value = 'redeem';
        rssGiftCodeInput.value = 'RBX-994820A';
        const demoFile = await generateDemoRobuxScreenshotBlob('gift', giftAmt, me.robloxName || me.usn);
        loadProofFile(demoFile);
        UI.toast('Skenario 3 siap: Foto "15,000" + Input 15000 pada Tier Pemula dengan Bukti Gift/Redeem RBX-994820A (Lolos!).', 'info');
      });
    }

    /* Scenario 4: Pemula claiming 38,700 R$ WITHOUT Gift/Redeem Proof (OCR matches 38.7K, but Fails Tier Plausibility!) */
    if (rssGenRookieFail) {
      rssGenRookieFail.addEventListener('click', async function () {
        if (rssTierSelect) {
          rssTierSelect.value = 'pemula';
          syncTierTelemetryFromSelect();
        }
        rssAmountInput.value = '38700';
        rssOriginSelect.value = 'earned';
        rssGiftCodeInput.value = '';
        const demoFile = await generateDemoRobuxScreenshotBlob('balance_pill', 38700, me.robloxName || me.usn);
        loadProofFile(demoFile);
        UI.toast('Skenario 4 siap: Foto "38.7K" + Input 38700 cocok, namun Tier adalah Pemula tanpa bukti Gift (Ditolak di Tahap 4!).', 'warn');
      });
    }

    /* Scenario 5: Internet Pinterest Repost / Text "R$" only without Hexagonal Robux Logo */
    if (rssGenInvalid) {
      rssGenInvalid.addEventListener('click', async function () {
        const badFile = await generateDemoRobuxScreenshotBlob('invalid', 999999, me.robloxName || me.usn);
        loadProofFile(badFile);
        UI.toast('Skenario 5 siap: Gambar hasil Pin Internet tanpa Logo Segi-Enam Robux. Klik Mulai Pemindaian!', 'warn');
      });

        Modules.Main.render();
      });
    }

    if (rssForm) {
      rssForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!selectedProofFile) {
          UI.toast('Pilih file screenshot atau klik salah satu tombol Skenario Uji (1–5) terlebih dahulu.', 'warn');
          return;
        }
        const submitBtn = container.querySelector('#rss-submit-btn');
        submitBtn.disabled = true;

        if (rssScanGrid) rssScanGrid.classList.remove('hidden');
        if (rssScanLaser) rssScanLaser.classList.remove('hidden');
        rssAiChecks.innerHTML = '';

        const chosenTier = rssTierSelect ? rssTierSelect.value : 'sedang';
        syncTierTelemetryFromSelect();
        const liveUser = Store.get('users', me.usn);
        const claimedAmount = Math.max(0, parseRobuxNominalInput(rssAmountInput.value));
        const abbrevClaim = formatRobuxAbbrev(claimedAmount);
        const sourceType = rssSourceSelect.value;
        const originClaim = rssOriginSelect.value;
        const giftCodeInput = rssGiftCodeInput.value;

        /* Run the deep forensic + real Canvas Glyph OCR analysis */
        const result = await analyzeRobuxScreenshot(selectedProofFile, claimedAmount, sourceType, originClaim, giftCodeInput, liveUser, chosenTier);

        const stageLabels = [
          'Tahap 1/5: Memeriksa sidik jari dHash & mendeteksi indikasi gambar Pin Internet / Repost…',
          'Tahap 2/5: Memindai geometri vektor Logo Segi-Enam Robux (Emas/Balance Pill & Dark Hex)…',
          'Tahap 3/5: Membaca karakter OCR di foto & mencocokkannya dengan input (' + claimedAmount.toLocaleString() + ' R$)…',
          'Tahap 4/5: Menimbang status profil (' + result.profileTier + ') & menghitung % kewajaran nominal…',
          'Tahap 5/5: Memeriksa sumber saldo / bukti Gift & menyegel keputusan akhir…'
        ];

        for (let step = 0; step < stageLabels.length; step++) {
          const pct = Math.round(((step + 1) / stageLabels.length) * 100);
          if (rssAiProg) rssAiProg.style.width = pct + '%';
          if (rssAiBadge) rssAiBadge.textContent = 'MEMINDAI ' + pct + '%…';
          if (rssAiSummary) rssAiSummary.textContent = stageLabels[step];
          submitBtn.innerHTML = UI.icon('refresh', 16) + ' ' + stageLabels[step].slice(0, 48) + '…';

          await new Promise(function (r) { setTimeout(r, 640); });

          if (result.checks && result.checks[step]) {
            const c = result.checks[step];
            const rowEl = document.createElement('div');
            rowEl.className = 'ai-check-row ' + (c.pass ? 'pass' : 'fail');
            rowEl.innerHTML =
              '<span>' + (c.pass ? '✔ ' : '✘ ') + '<strong>' + S.esc(c.label) + '</strong></span>' +
              '<span class="mono">' + S.esc(c.detail) + '</span>';
            rssAiChecks.appendChild(rowEl);
          }
        }

        /* Stop laser and draw both Logo Reticle AND OCR Digit Match/Mismatch Box */
        if (rssScanGrid) rssScanGrid.classList.add('hidden');
        if (rssScanLaser) rssScanLaser.classList.add('hidden');
        drawPreviewOnCanvas(selectedProofFile, result.logoCoords, {
          ocrResult: result.ocrResult,
          claimedAmount: result.claimedAmount,
          exactNominalMatch: result.exactNominalMatch
        });

        rssAiSummary.textContent = result.reason;
        rssAiBadge.textContent = result.valid
          ? 'LOLOS AUDIT AI (' + result.score + '% · OCR Cocok 100%)'
          : 'DITOLAK AI (' + (!result.exactNominalMatch ? 'Nominal Tidak Cocok' : 'Kewajaran ' + result.plausibility + '%') + ')';

        /* Store proof privately in Vault */
        const vaultId = S.uuid('rbx_prf');
        await Core.Vault.put(vaultId, selectedProofFile, { privateProof: true, valid: result.valid, amount: claimedAmount });

        const freshUser = Store.get('users', me.usn);
        const existingProofs = Array.isArray(freshUser.robuxProofs) ? freshUser.robuxProofs.slice() : [];
        existingProofs.push({
          id: S.uuid('prf'),
          vaultId: vaultId,
          dHash: result.dHash,
          amount: result.valid ? claimedAmount : 0,
          claimedAmount: claimedAmount,
          sourceType: sourceType + (originClaim !== 'earned' ? ' · ' + originClaim.toUpperCase() : ''),
          valid: result.valid,
          score: result.score,
          plausibility: result.plausibility,
          reason: result.reason,
          at: Date.now()
        });

        const newTotalVerified = existingProofs
          .filter(function (p) { return p && p.valid; })
          .reduce(function (sum, p) { return sum + (Number(p.amount) || 0); }, 0);

        Store.update('users', me.usn, {
          robuxProofs: existingProofs,
          verifiedRobux: newTotalVerified
        });

        submitBtn.disabled = false;
        submitBtn.innerHTML = UI.icon('shieldCheck', 16) + ' Mulai Pemindaian Mendalam AI (5 Tahap Forensik & OCR)';

        const valNode = container.querySelector('#profile-net-robux-val');
        if (valNode) valNode.textContent = newTotalVerified.toLocaleString() + ' R$';

        if (result.valid) {
          Core.Audit.log(me.usn, 'ROBUX_PROOF_VERIFIED', 'AI verified +' + claimedAmount.toLocaleString() + ' R$ (OCR "' + (result.ocrResult && result.ocrResult.text) + '" matched input).');
          UI.toast('Lolos 5 Tahap Audit AI & OCR! +' + claimedAmount.toLocaleString() + ' R$ (' + abbrevClaim + ') ditambahkan ke Net Creator Revenue.', 'success');
          setTimeout(function () { Modules.Main.render(); }, 1800);
        } else {
          Core.Audit.log(me.usn, 'ROBUX_PROOF_REJECTED', 'AI rejected Robux screenshot: ' + result.reason.slice(0, 140));
          UI.toast(result.reason, 'error');
        }
      });
    }
  }

  function wireSubmit(container, me) {
    const UI = Modules.UI;
    const state = { tags: [], file: null, previewUrl: null, dimensions: null, duration: null };
    const titleInput = container.querySelector('#sb-title');
    const descInput = container.querySelector('#sb-desc');
    const fileInput = container.querySelector('#sb-file');
    const drop = container.querySelector('#sb-drop');
    const preview = container.querySelector('#sb-preview');
    const fileLabel = container.querySelector('#sb-file-label');
    const fileHint = container.querySelector('#sb-file-hint');
    const errBox = container.querySelector('#sb-err');

    function counters() {
      container.querySelector('#sb-title-count').textContent = UI.charCount(titleInput.value, CFG.LIMITS.titleMax);
      container.querySelector('#sb-desc-count').textContent = UI.charCount(descInput.value, CFG.LIMITS.descMax);
    }
    counters();
    titleInput.addEventListener('input', counters);
    descInput.addEventListener('input', counters);

    container.querySelector('#sb-tags').addEventListener('click', function (e) {
      const btn = e.target.closest('[data-tag]');
      if (!btn) return;
      const tag = btn.dataset.tag;
      const idx = state.tags.indexOf(tag);
      if (idx === -1) state.tags.push(tag); else state.tags.splice(idx, 1);
      btn.classList.toggle('active');
    });

    function acceptFile(file) {
      errBox.classList.add('hidden');
      if (!file) return;
      const isImage = /^image\//.test(file.type);
      const isVideo = /^video\//.test(file.type);
      if (!isImage && !isVideo) {
        errBox.textContent = 'Unsupported media format. Only image/* (max 5 MB) and video/* (max 3 MB) are permitted.';
        errBox.classList.remove('hidden');
        fileInput.value = '';
        return;
      }
      if (isImage && file.size > CFG.LIMITS.imgBytes) {
        errBox.textContent = 'Photo exceeds the strict 5.00 MB limit (' + UI.fmtBytes(file.size) + ').';
        errBox.classList.remove('hidden');
        fileInput.value = '';
        return;
      }
      if (isVideo && file.size > CFG.LIMITS.vidBytes) {
        errBox.textContent = 'Video exceeds the strict 3.00 MB limit (' + UI.fmtBytes(file.size) + ').';
        errBox.classList.remove('hidden');
        fileInput.value = '';
        return;
      }
      state.file = file;
      state.dimensions = null;
      state.duration = null;
      if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
      state.previewUrl = URL.createObjectURL(file);
      fileLabel.textContent = file.name + ' · ' + UI.fmtBytes(file.size) + ' (' + file.type + ')';
      preview.classList.remove('hidden');

      if (isImage) {
        preview.innerHTML = '<img id="sb-live-img" src="' + state.previewUrl + '" alt="Upload preview" />';
        const imgEl = preview.querySelector('#sb-live-img');
        imgEl.onload = function () {
          state.dimensions = imgEl.naturalWidth + '×' + imgEl.naturalHeight + 'px';
          fileHint.textContent = 'Validated Image: ' + state.dimensions + ' · ' + UI.fmtBytes(file.size) + ' (within 5 MB policy).';
        };
      } else {
        preview.innerHTML = '<video id="sb-live-vid" src="' + state.previewUrl + '" controls muted playsinline></video>';
        const vidEl = preview.querySelector('#sb-live-vid');
        vidEl.onloadedmetadata = function () {
          state.dimensions = (vidEl.videoWidth || 0) + '×' + (vidEl.videoHeight || 0) + 'px';
          state.duration = Math.round(vidEl.duration || 0);
          fileHint.textContent = 'Validated Video: ' + state.dimensions + ' · ' + state.duration + 's · ' + UI.fmtBytes(file.size) + ' (within 3 MB policy).';
        };
      }
    }

    fileInput.addEventListener('change', function () { acceptFile(fileInput.files[0]); });
    ['dragover', 'dragenter'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('drag'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('drag'); });
    });
    drop.addEventListener('drop', function (e) {
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      acceptFile(file);
    });

    container.querySelector('#submit-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.classList.add('hidden');
      const problems = [];
      const titleScan = S.sanitize(titleInput.value.trim());
      const descScan = S.sanitize(descInput.value.trim());
      const luauScan = S.sanitize(container.querySelector('#sb-luau').value.trim());

      if (titleScan.flags.length || descScan.flags.length || luauScan.flags.length) {
        UI.toast('Restricted government identifier stripped and redacted from submission.', 'warn');
        S.logViolation(me.usn, 'PII_REDACTED', 'Submission text contained restricted identifier pattern.');
      }

      const title = titleScan.clean.slice(0, CFG.LIMITS.titleMax);
      if (!title) problems.push('Asset Title is required.');
      const category = container.querySelector('#sb-cat').value;
      if (!category) problems.push('Category is required.');
      const price = Math.max(0, Math.min(CFG.LIMITS.priceMax, Number(container.querySelector('#sb-price').value) || 0));
      const version = S.sanitize(container.querySelector('#sb-version').value.trim()).clean.slice(0, 20) || 'v1.0.0';
      const license = container.querySelector('#sb-license').value;
      const desc = descScan.clean.slice(0, CFG.LIMITS.descMax);
      const luauManifest = luauScan.clean.slice(0, 1800);

      if (problems.length) {
        errBox.textContent = problems.join(' ');
        errBox.classList.remove('hidden');
        return;
      }

      const submitBtn = container.querySelector('#sb-submit');
      submitBtn.disabled = true;
      submitBtn.innerHTML = UI.icon('refresh', 16) + ' Storing Media in Vault…';
      try {
        let media = null;
        if (state.file) {
          const vaultId = S.uuid('med');
          await Core.Vault.put(vaultId, state.file, { dimensions: state.dimensions, duration: state.duration });
          media = {
            kind: /^image\//.test(state.file.type) ? 'image' : 'video',
            vaultId: vaultId,
            name: state.file.name,
            size: state.file.size,
            mime: state.file.type,
            dimensions: state.dimensions,
            duration: state.duration
          };
        }
        Store.insert('queue', {
          id: S.uuid('sub'),
          postType: 'market',
          creatorUSN: me.usn,
          creatorRole: me.role,
          title: title,
          desc: desc,
          luauManifest: luauManifest,
          version: version,
          license: license,
          category: category,
          tags: state.tags.slice(),
          price: price,
          media: media,
          state: 'pending',
          reviewBy: null,
          lockAt: null,
          createdAt: Date.now()
        });
        Core.Audit.log(me.usn, 'SUBMISSION_QUEUED', '"' + title + '" (' + (media ? media.kind : 'no-media') + ') queued for verification.');
        UI.toast('Asset queued for staff inspection (media + manifest attached).', 'success');
        Modules.Main.navigate('/workspace');
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = UI.icon('shieldCheck', 16) + ' Submit to Synchronized Staff Queue';
        errBox.textContent = 'Submission failed: ' + err.message;
        errBox.classList.remove('hidden');
      }
    });
  }

  /* ---------------------------------------- CREATOR WORKSPACE & DEVEX -- */
  function viewWorkspace(container) {
    const UI = Modules.UI;
    const me = Modules.Auth.current();
    if (!me) return;
    const myListings = Store.where('market', function (m) { return m.creatorUSN === me.usn; });
    const mySubs = Store.where('queue', function (q) { return q.creatorUSN === me.usn; }).sort(function (a, b) { return b.createdAt - a.createdAt; });
    const purchases = Store.where('txns', function (t) { return t.buyerUSN === me.usn; }).sort(function (a, b) { return b.at - a.at; });
    const sales = Store.where('txns', function (t) { return t.sellerUSN === me.usn; }).sort(function (a, b) { return b.at - a.at; });

    container.innerHTML =
      '<div class="view">' +
      '<div class="view-head"><div><h1 class="view-title">' + UI.icon('grid', 22) + ' Creator Workspace & Studio Utilities</h1>' +
      '<p class="view-sub">Manage live listings, track moderation queue inspections, settle escrow trades, and calculate DevEx payouts.</p></div>' +
      '<a class="btn btn-primary" href="#/submit">' + UI.icon('upload', 16) + ' New Asset Submission</a></div>' +

      '<div class="tabs" id="ws-tabs">' +
      '<button class="tab active" data-tab="listings">Live Listings (' + myListings.length + ')</button>' +
      '<button class="tab" data-tab="subs">Moderation Pipeline (' + mySubs.length + ')</button>' +
      '<button class="tab" data-tab="buys">Purchases & Claims (' + purchases.length + ')</button>' +
      '<button class="tab" data-tab="sales">Sales & Escrow (' + sales.length + ')</button>' +
      '<button class="tab" data-tab="devex">Robux & DevEx Calculator</button></div>' +
      '<div id="ws-pane"></div></div>';

    const pane = container.querySelector('#ws-pane');

    function txnRow(t, side) {
      const tone = t.state === 'completed' ? 'ok' : t.state === 'escrow' ? 'info' : t.state === 'disputed' ? 'bad' : 'warn';
      let actions = '';
      if (side === 'buyer') {
        if (t.state === 'escrow') {
          actions = '<button class="btn btn-sm btn-success" data-confirm-txn="' + t.uuid + '">Confirm Delivery</button> ' +
            '<button class="btn btn-sm btn-danger" data-dispute-txn="' + t.uuid + '">Dispute</button>';
        }
      } else if (t.state === 'escrow') {
        actions = '<button class="btn btn-sm btn-ghost" data-refund-txn="' + t.uuid + '">Refund Buyer</button>';
      }
      return '<tr><td class="mono">' + S.esc(t.uuid.slice(-10)) + '</td><td>' + S.esc(S.guard(t.listingTitle)) + '</td>' +
        '<td>' + (side === 'buyer' ? '@' + S.esc(t.sellerUSN) : '@' + S.esc(t.buyerUSN)) + '</td>' +
        '<td>' + S.esc(UI.robux(t.price)) + '</td><td>' + UI.tonePill(t.state, tone) + '</td>' +
        '<td class="muted">' + S.esc(UI.timeAgo(t.at)) + '</td><td>' + actions + '</td></tr>';
    }

    function renderPane(tab) {
      if (tab === 'listings') {
        pane.innerHTML = myListings.length
          ? '<div class="grid-market">' + myListings.map(function (m) { return Modules.Market.cardHTML(m); }).join('') + '</div>' +
            '<div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Asset Title</th><th>Version</th><th>Price</th><th>Status</th><th>Sales</th><th>Actions</th></tr></thead><tbody>' +
            myListings.map(function (m) {
              return '<tr><td>' + S.esc(S.guard(m.title)) + '</td><td class="mono">' + S.esc(m.version || 'v1.0.0') + '</td><td>' + S.esc(UI.robux(m.price)) + '</td><td>' + UI.tonePill(m.status, m.status === 'active' ? 'ok' : 'warn') + '</td><td>' + m.sales + '</td>' +
                '<td>' + (m.status === 'active' ? '<button class="btn btn-sm btn-danger" data-withdraw="' + m.id + '">' + UI.icon('trash', 14) + ' Withdraw</button>' : '') + '</td></tr>';
            }).join('') + '</tbody></table></div>'
          : UI.emptyState('grid', 'No active listings found. Start showcasing your work!', 'Approved submissions appear here with SHA-256 integrity signatures.');
      } else if (tab === 'subs') {
        pane.innerHTML = mySubs.length
          ? '<div class="table-wrap"><table class="table"><thead><tr><th>Preview</th><th>Target Channel</th><th>Title & Detail</th><th>Category / Topic</th><th>Media Info</th><th>Queue Status</th><th>Submitted</th><th></th></tr></thead><tbody>' +
          mySubs.map(function (q) {
            const pType = q.postType || 'market';
            const chLabel = pType === 'showcase' ? '🎨 Dashboard Showcase' : pType === 'forum' ? '🔥 Forum Keluhan' : '🛒 Marketplace Asset';
            const pill = q.state === 'pending' ? UI.tonePill('Pending Staff Review', 'info') : UI.tonePill('Under Review by Staff ' + q.reviewBy, 'warn');
            const cancel = q.state === 'pending' ? '<button class="btn btn-sm btn-ghost" data-cancel-sub="' + q.id + '">Cancel</button>' : '';
            const mediaInfo = q.media ? (q.media.kind.toUpperCase() + ' · ' + UI.fmtBytes(q.media.size)) : 'Text / Manifest only';
            return '<tr style="cursor:pointer" data-inspect-sub="' + S.esc(q.id) + '"><td style="width:110px">' + UI.mediaNode(q.media, 'asset-media', false, q.id) + '</td>' +
              '<td><span class="channel-pill" data-channel="' + S.esc(pType) + '">' + S.esc(chLabel) + '</span></td>' +
              '<td><strong>' + S.esc(S.guard(q.title)) + '</strong><br><span class="mono muted">' + S.esc(q.version || (pType === 'showcase' ? 'Pamer Karya' : pType === 'forum' ? 'Thread Keluhan' : 'v1.0.0')) + '</span></td>' +
              '<td>' + S.esc(q.category || q.showcaseType || q.board || 'General') + '</td><td class="mono">' + S.esc(mediaInfo) + '</td><td>' + pill + '</td><td class="muted">' + S.esc(UI.timeAgo(q.createdAt)) + '</td><td>' + cancel + '</td></tr>';
          }).join('') + '</tbody></table></div>'
          : UI.emptyState('upload', 'No submissions in queue', 'Your verification pipeline is empty. Every new Marketplace, Dashboard Showcase, or Forum post waits here until approved.');
      } else if (tab === 'buys') {
        pane.innerHTML = purchases.length
          ? '<div class="table-wrap"><table class="table"><thead><tr><th>Txn UUID</th><th>Asset</th><th>Seller</th><th>Price</th><th>State</th><th>When</th><th>Actions</th></tr></thead><tbody>' +
          purchases.map(function (t) { return txnRow(t, 'buyer'); }).join('') + '</tbody></table></div>'
          : UI.emptyState('bag', 'No purchases yet', 'Assets you claim or purchase are tracked here with escrow protection.');
      } else if (tab === 'sales') {
        pane.innerHTML = sales.length
          ? '<div class="table-wrap"><table class="table"><thead><tr><th>Txn UUID</th><th>Asset</th><th>Buyer</th><th>Price</th><th>State</th><th>When</th><th>Actions</th></tr></thead><tbody>' +
          sales.map(function (t) { return txnRow(t, 'seller'); }).join('') + '</tbody></table></div>'
          : UI.emptyState('coin', 'No sales recorded yet', 'Once buyers claim your signed listings, revenue events stream into this ledger.');
      } else if (tab === 'devex') {
        pane.innerHTML =
          '<div class="grid-2">' +
          '<div class="card"><div class="card-head"><h3>' + UI.icon('coin', 16) + ' Robux Escrow & DevEx USD Estimator</h3></div>' +
          '<div class="card-body form">' +
          '<div class="field"><label class="label" for="dx-robux">Gross Asset / Commission Price (Robux R$)</label>' +
          '<input class="input mono" id="dx-robux" type="number" min="0" max="100000000" value="5000" /></div>' +
          '<div class="grid-telemetry">' +
          '<div class="tele-card"><span class="tele-num accent-g" id="dx-net-rcp">4,500 R$</span><span class="tele-label">Net on RCP (90% after 10% fee)</span></div>' +
          '<div class="tele-card"><span class="tele-num accent-b" id="dx-net-rbx">3,500 R$</span><span class="tele-label">Roblox Gamepass Net (70%)</span></div>' +
          '<div class="tele-card"><span class="tele-num accent-a" id="dx-usd">$15.75</span><span class="tele-label">Est. DevEx Cashout ($0.0035/R$)</span></div>' +
          '</div></div></div>' +
          '<div class="card"><div class="card-head"><h3>' + UI.icon('shield', 16) + ' Privacy Firewall Self-Test Sandbox</h3></div>' +
          '<div class="card-body form">' +
          '<div class="field"><label class="label" for="fw-test">Test Text Against Gov-ID Sanitization (KR RRN, JP MyNumber, IN Aadhaar)</label>' +
          '<input class="input" id="fw-test" placeholder="Type sample text or ID format to verify redaction…" /></div>' +
          '<div class="copy-box" id="fw-out">Clean output preview appears here…</div>' +
          '</div></div></div>';

        const dxInput = pane.querySelector('#dx-robux');
        dxInput.addEventListener('input', function () {
          const val = Math.max(0, Number(dxInput.value) || 0);
          const netRcp = Math.round(val * 0.9);
          const netRbx = Math.round(val * 0.7);
          const usd = (netRcp * 0.0035).toFixed(2);
          pane.querySelector('#dx-net-rcp').textContent = netRcp.toLocaleString() + ' R$';
          pane.querySelector('#dx-net-rbx').textContent = netRbx.toLocaleString() + ' R$';
          pane.querySelector('#dx-usd').textContent = '$' + usd;
        });
        const fwInput = pane.querySelector('#fw-test');
        fwInput.addEventListener('input', function () {
          const res = S.sanitize(fwInput.value);
          pane.querySelector('#fw-out').textContent = res.clean || 'Clean output preview appears here…';
        });
      }
      UI.hydrateMedia(pane);
      const grid = pane.querySelector('.grid-market');
      if (grid) Modules.Market.wireGrid(grid);
    }

    renderPane('listings');
    container.querySelector('#ws-tabs').addEventListener('click', function (e) {
      const tab = e.target.closest('[data-tab]');
      if (!tab) return;
      container.querySelectorAll('#ws-tabs .tab').forEach(function (b) { b.classList.toggle('active', b === tab); });
      renderPane(tab.dataset.tab);
    });

    pane.addEventListener('click', function (e) {
      const withdraw = e.target.closest('[data-withdraw]');
      const cancel = e.target.closest('[data-cancel-sub]');
      const inspectSub = e.target.closest('[data-inspect-sub]');
      if (inspectSub && !cancel) {
        const subRec = Store.get('queue', inspectSub.dataset.inspectSub);
        if (subRec) UI.inspectMediaModal(subRec);
        return;
      }
      const confirmTxn = e.target.closest('[data-confirm-txn]');
      const disputeTxn = e.target.closest('[data-dispute-txn]');
      const refundTxn = e.target.closest('[data-refund-txn]');
      if (withdraw) {
        const id = withdraw.dataset.withdraw;
        UI.confirmDialog('Withdraw listing', 'This removes the listing from the public marketplace and purges its media blob.', 'Withdraw', true, async function () {
          const rec = Store.get('market', id);
          if (rec && rec.media) await Core.Vault.remove(rec.media.vaultId);
          Store.remove('market', id);
          Core.Audit.log(me.usn, 'LISTING_WITHDRAWN', '"' + (rec ? rec.title : id) + '" withdrawn by creator.');
          UI.toast('Listing withdrawn.', 'success');
          Modules.Main.render();
        });
      }
      if (cancel) {
        const id = cancel.dataset.cancelSub;
        UI.confirmDialog('Cancel submission', 'The pending submission and its media blob will be removed from the queue.', 'Cancel submission', true, async function () {
          const rec = Store.get('queue', id);
          if (rec && rec.media) await Core.Vault.remove(rec.media.vaultId);
          Store.remove('queue', id);
          Core.Audit.log(me.usn, 'SUBMISSION_CANCELLED', '"' + (rec ? rec.title : id) + '" cancelled by creator.');
          UI.toast('Submission cancelled.', 'success');
          Modules.Main.render();
        });
      }
      if (confirmTxn) {
        const t = Store.update('txns', confirmTxn.dataset.confirmTxn, { state: 'completed', completedAt: Date.now() });
        Core.Audit.log(me.usn, 'TXN_COMPLETED', 'Buyer confirmed delivery for ' + t.uuid + '.');
        UI.toast('Delivery confirmed. Escrow released to seller ledger.', 'success');
        Modules.Main.render();
      }
      if (disputeTxn) {
        const id = disputeTxn.dataset.disputeTxn;
        UI.modal({
          title: 'Open an Escrow Dispute',
          body: '<div class="field"><label class="label" for="dsp-reason">Describe the issue</label>' +
            '<textarea class="textarea" id="dsp-reason" placeholder="Detail why the delivered asset did not match specifications…"></textarea></div>',
          actions: [
            { label: 'Cancel', cls: 'btn-ghost' },
            {
              label: 'File Dispute', cls: 'btn-danger', onClick: function (close, overlay) {
                const raw = overlay.querySelector('#dsp-reason').value;
                const scan = S.sanitize(raw);
                if (scan.flags.length) UI.toast('Restricted identifier pattern stripped from dispute text.', 'warn');
                Store.update('txns', id, { state: 'disputed' });
                Store.insert('reports', {
                  id: S.uuid('rep'), targetType: 'txn', targetId: id,
                  reason: scan.clean.slice(0, 300) || 'Dispute without note', reporterUSN: me.usn, state: 'open', at: Date.now()
                });
                Core.Audit.log(me.usn, 'TXN_DISPUTED', 'Dispute opened on ' + id + '.');
                close(); UI.toast('Dispute filed for staff arbitration.', 'success'); Modules.Main.render();
              }
            }
          ]
        });
      }
      if (refundTxn) {
        const id = refundTxn.dataset.refundTxn;
        UI.confirmDialog('Refund transaction', 'Escrow is returned to the buyer and the listing returns to active status.', 'Refund', true, function () {
          const t = Store.get('txns', id);
          Store.update('txns', id, { state: 'refunded' });
          if (t) {
            const listing = Store.get('market', t.listingId);
            if (listing) Store.update('market', t.listingId, { status: 'active', sales: Math.max(0, listing.sales - 1) });
          }
          Core.Audit.log(me.usn, 'TXN_REFUNDED', 'Seller refunded ' + id + '.');
          UI.toast('Refund processed.', 'success'); Modules.Main.render();
        });
      }
    });
  }


  /* ------------------------------------------------ CREATOR DIRECTORY -- */
  function viewDirectory(container) {
    const UI = Modules.UI;
    const allUsers = Store.list('users').sort(function (a, b) { return b.joinedAt - a.joinedAt; });
    const state = { q: '', tag: '', status: '' };

    function paint() {
      let list = allUsers.slice();
      if (state.q) {
        const q = state.q.toLowerCase();
        list = list.filter(function (u) {
          return (u.usn + ' ' + u.displayName + ' ' + (u.headline || '') + ' ' + (u.robloxName || '')).toLowerCase().includes(q);
        });
      }
      if (state.tag) {
        list = list.filter(function (u) { return (u.tags || []).indexOf(state.tag) !== -1; });
      }
      if (state.status) {
        list = list.filter(function (u) { return u.status === state.status; });
      }
      const host = container.querySelector('#cd-grid');
      if (!allUsers.length) {
        host.innerHTML = UI.emptyState(
          'users',
          'No active listings found. Start showcasing your work!',
          'No creators have registered on this device yet. Create the first creator account to populate the directory.',
          '<a class="btn btn-primary" href="#/auth?mode=register">' + UI.icon('user', 15) + ' Register Creator Account</a>'
        );
        return;
      }
      if (!list.length) {
        host.innerHTML = UI.emptyState('search', 'No matching creators', 'Try clearing your specialization or availability filters.');
        return;
      }
      host.innerHTML = '<div class="grid-market">' + list.map(function (u) {
        const count = Store.count('market', function (m) { return m.creatorUSN === u.usn && m.status === 'active'; });
        return '<div class="card creator-dir-card" data-nav="#/u/' + S.esc(u.usn) + '">' +
          '<div class="card-body col" style="gap:11px">' +
          '<div class="row" style="gap:12px">' + UI.avatar(u, 48) +
          '<div style="min-width:0"><strong style="font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + S.esc(S.guard(u.displayName)) + '</strong>' +
          '<span class="mono muted">@' + S.esc(u.usn) + '</span></div></div>' +
          '<div class="row wrap">' + UI.roleBadge(u.role) + UI.statusPill(u.status) + '</div>' +
          '<p class="muted" style="font-size:12.5px">' + S.esc(S.guard(u.headline || 'Roblox Creator & Developer')) + '</p>' +
          '<div class="row wrap">' + ((u.tags || []).slice(0, 4).map(function (t) { return UI.chip(t); }).join('') || '<span class="faint" style="font-size:12px">No tags</span>') + '</div>' +
          '<div class="row between" style="margin-top:auto;padding-top:8px;border-top:1px solid var(--line-soft);font-size:12px">' +
          '<span class="muted">' + count + ' live work(s)</span>' +
          '<span class="price-badge' + (Number(u.commission && u.commission.minPrice) === 0 ? ' free' : '') + '">From ' + S.esc(UI.robux(u.commission && u.commission.minPrice || 0)) + '</span>' +
          '</div></div></div>';
      }).join('') + '</div>';
    }

    container.innerHTML =
      '<div class="view">' +
      '<div class="view-head"><div><h1 class="view-title">' + UI.icon('users', 22) + ' Verified Creator Directory</h1>' +
      '<p class="view-sub">Browse registered Roblox builders, scripters, UI designers, and 3D modelers available for commissions.</p></div>' +
      '<span class="chip">' + allUsers.length + ' registered creator(s)</span></div>' +
      '<div class="filters">' +
      '<input class="input search" id="cd-q" placeholder="Search @username, display name, or Roblox account…" />' +
      '<select class="select" id="cd-tag"><option value="">All Specializations</option>' +
      CFG.TAGS.map(function (t) { return '<option value="' + S.esc(t) + '">' + S.esc(t) + '</option>'; }).join('') + '</select>' +
      '<select class="select" id="cd-status"><option value="">All Availability</option>' +
      Object.keys(CFG.STATUS).map(function (k) { return '<option value="' + k + '">' + CFG.STATUS[k].emoji + ' ' + CFG.STATUS[k].label + '</option>'; }).join('') + '</select>' +
      '</div><div id="cd-grid"></div></div>';

    container.querySelector('#cd-q').addEventListener('input', function (e) { state.q = e.target.value.trim(); paint(); });
    container.querySelector('#cd-tag').addEventListener('change', function (e) { state.tag = e.target.value; paint(); });
    container.querySelector('#cd-status').addEventListener('change', function (e) { state.status = e.target.value; paint(); });
    paint();
  }

  return Object.freeze({
    viewDirectory: viewDirectory,
    viewProfile: viewProfile,
    viewPublic: viewPublic,
    viewSubmit: viewSubmit,
    viewWorkspace: viewWorkspace
  });
});

'use strict';
/* ============================================================================
   RCP MARKETPLACE, SHOWCASE WALL & MULTIMEDIA COMPLAINT FORUM (v4.2)

      assets (Robux pricing, SHA-256 anti-tamper signature, 10s debounce, escrow).

      complaints & rants (supports photo <=5MB & video <=3MB attachments,
      complaint categories, severity tags, "Setuju / Relate" votes, & replies).
   ========================================================================== */
RCP._connect('Market', function (Core, Modules) {

  function extractDomPrice(card, fallbackPrice) {
    if (!card) return Number(fallbackPrice);
    const attrPrice = Number(card.dataset.price);
    const badge = card.querySelector('[data-price-display]');
    if (badge) {
      const badgeAttr = Number(badge.dataset.priceDisplay);
      const rawText = badge.textContent.trim().toUpperCase();
      const parsedTextPrice = rawText.includes('FREE') ? 0 : Number(rawText.replace(/[^0-9]/g, ''));
      if (!Number.isNaN(parsedTextPrice) && parsedTextPrice !== attrPrice) {
        return parsedTextPrice;
      }
      if (!Number.isNaN(badgeAttr) && badgeAttr !== attrPrice) {
        return badgeAttr;
      }
    }
    return attrPrice;
  }

  async function handleBuy(listingId, btn) {
    const UI = Modules.UI;
    const me = Modules.Auth.current();
    if (!me) { UI.toast('Sign in to buy or claim marketplace assets.', 'warn'); Modules.Main.navigate('/auth'); return; }
    const card = btn.closest('.asset-card') || document.querySelector('.asset-card[data-id="' + listingId + '"]');
    const listing = Store.get('market', listingId);
    if (!listing) { UI.toast('Listing no longer exists in local memory.', 'error'); return; }
    if (listing.creatorUSN === me.usn) { UI.toast('You cannot purchase your own listing.', 'warn'); return; }
    if (listing.status !== 'active') { UI.toast('This listing has already been sold.', 'warn'); return; }

    const domPrice = extractDomPrice(card, listing.price);
    const domSig = card && card.dataset.sig ? card.dataset.sig : listing.signature;
    const recomputed = await S.sign(listingId, domPrice, listing.creatorUSN);

    if (recomputed !== listing.signature || domSig !== listing.signature || domPrice !== Number(listing.price)) {
      S.logViolation(
        me.usn,
        'PRICE_TAMPER_BLOCKED',
        'Inspect Element tamper on ' + listingId + ': DOM price=' + domPrice + ' vs signed=' + listing.price + '.'
      );
      Core.Audit.log('security', 'CHECKOUT_ABORTED', 'Cryptographic signature mismatch on ' + listingId + ' by @' + me.usn + '.');
      if (card) card.classList.add('flagged');
      UI.toast('Security violation: Inspect Element price manipulation detected! Checkout aborted and logged.', 'error');
      return;
    }

    const lockKey = listingId + '::' + me.usn;
    const existing = Store.where('txns', function (t) { return t.listingId === listingId && t.buyerUSN === me.usn && t.state === 'escrow'; });
    if (existing.length) { UI.toast('You already hold an active escrow claim for this asset.', 'warn'); return; }

    if (claimLocks.has(lockKey) && claimLocks.get(lockKey) > Date.now()) {
      const n = (spamCount.get(lockKey) || 0) + 1;
      spamCount.set(lockKey, n);
      if (n >= 3) {
        S.logViolation(me.usn, 'CLAIM_SPAM', 'Rapid double-claim spam detected on ' + listingId + '.');
      }
      UI.toast('Debounce lock active (10s). Please wait.', 'warn');
      return;
    }

    claimLocks.set(lockKey, Date.now() + CFG.CLAIM_LOCK_MS);
    btn.disabled = true;
    const original = btn.innerHTML;
    let secLeft = Math.round(CFG.CLAIM_LOCK_MS / 1000);
    btn.innerHTML = UI.icon('refresh', 14) + ' Locking Escrow (' + secLeft + 's)…';
    if (card) card.classList.add('is-claiming');

    const countdownTimer = setInterval(function () {
      secLeft -= 1;
      if (secLeft > 0 && btn.isConnected) {
        btn.innerHTML = UI.icon('refresh', 14) + ' Debounce Lock (' + secLeft + 's)…';
      } else {
        clearInterval(countdownTimer);
      }
    }, 1000);

    setTimeout(function () {
      clearInterval(countdownTimer);
      const live = Store.get('market', listingId);
      if (live && live.status === 'active' && btn.isConnected) {
        btn.disabled = false;
        btn.innerHTML = original;
        if (card) card.classList.remove('is-claiming');
      }
    }, CFG.CLAIM_LOCK_MS);

    const txn = {
      uuid: S.uuid('txn'),
      listingId: listingId,
      listingTitle: listing.title,
      buyerUSN: me.usn,
      sellerUSN: listing.creatorUSN,
      price: Number(listing.price),
      fee: Math.round(Number(listing.price) * CFG.FEE_RATE),
      state: 'escrow',
      at: Date.now(),
      completedAt: null,
      sigVerified: true
    };
    Store.insert('txns', txn);
    Store.update('market', listingId, { status: 'sold', sales: (listing.sales || 0) + 1 });
    Core.Audit.log(me.usn, 'TXN_ESCROW', 'Purchased & opened escrow for "' + listing.title + '" (' + txn.uuid + ').');
    UI.toast('Purchase secured in escrow (' + txn.uuid.slice(-10) + '). Confirm delivery in Workspace.', 'success');
    setTimeout(function () { Modules.Main.render(); }, 1100);
  }

        errBox.classList.remove('hidden');
        fileInput.value = '';
        return;
      }
      if (isVid && f.size > CFG.LIMITS.vidBytes) {
        errBox.textContent = 'Video exceeds 3 MB limit (' + UI.fmtBytes(f.size) + ').';
        errBox.classList.remove('hidden');
        fileInput.value = '';
        return;
      }
      modalState.file = f;
      if (modalState.previewUrl) URL.revokeObjectURL(modalState.previewUrl);
      modalState.previewUrl = URL.createObjectURL(f);
      label.textContent = f.name + ' · ' + UI.fmtBytes(f.size);
      preview.classList.remove('hidden');
      if (isImg) {
        preview.innerHTML = '<img id="sc-img-prev" src="' + modalState.previewUrl + '" alt="Preview" />';
        preview.querySelector('#sc-img-prev').onload = function (ev) {
          modalState.dimensions = ev.target.naturalWidth + '×' + ev.target.naturalHeight + 'px';
          hint.textContent = 'Ready: ' + modalState.dimensions + ' · ' + UI.fmtBytes(f.size);
        };
      } else {
        preview.innerHTML = '<video id="sc-vid-prev" src="' + modalState.previewUrl + '" controls muted playsinline></video>';
        preview.querySelector('#sc-vid-prev').onloadedmetadata = function (ev) {
          modalState.dimensions = (ev.target.videoWidth || 0) + '×' + (ev.target.videoHeight || 0) + 'px';
          modalState.duration = Math.round(ev.target.duration || 0);
          hint.textContent = 'Ready: ' + modalState.dimensions + ' · ' + modalState.duration + 's · ' + UI.fmtBytes(f.size);
        };
      }
    });
  }

  /* ==========================================================================
     PART C: MULTIMEDIA ROBLOX COMPLAINT & RANT FORUM (`#/forum`)
     ========================================================================== */
  function viewForum(container) {

    function openForumComposer() {

          '<span><strong>Wajib Antrean Moderasi (Zero-Bypass Queue):</strong> Meski Anda berstatus <strong>' + S.esc(Core.RBAC.label(me.role)) + '</strong> (termasuk Moderator/Owner maupun Regular User), setiap thread Forum Keluhan wajib masuk ke <strong>Moderation Queue</strong> sebelum terbit di Forum.</span></div>' +
          '<p class="muted">Suarakan keluhanmu tentang update Roblox, pajak 30%, bug Studio, false ban moderasi, atau bagikan tangkapan layar/video bukti langsung di bawah ini.</p>' +
          '<div class="grid-3" style="gap:12px">' +
          '<div class="field"><label class="label" for="df-title">Judul Keluhan / Topik</label><input class="input" id="df-title" maxlength="95" placeholder="contoh: Moderasi AI Roblox Banned Akun Saya Tanpa Alasan!" required /></div>' +
          '<div class="field"><label class="label" for="df-board">Kategori Keluhan</label><select class="select" id="df-board">' +
          CFG.FORUM_BOARDS.map(function (b) { return '<option value="' + S.esc(b) + '">' + S.esc(b) + '</option>'; }).join('') +
          '</select></div>' +
          '<div class="field"><label class="label" for="df-sev">Tingkat Emosi / Severity</label><select class="select" id="df-sev">' +
          '<option value="critical">🚨 Sangat Merugikan / Fatal</option>' +
          '<option value="annoying">😤 Bikin Emosi / Menyebalkan</option>' +
          '<option value="discussion">💬 Diskusi / Media Bebas</option>' +
          '</select></div></div>' +

          '<div class="field"><label class="label">Lampirkan Bukti Foto (&le; 5 MB) atau Video (&le; 3 MB) — Opsional / Bebas</label>' +
          '<label class="file-drop" id="df-drop">' + UI.icon('upload', 24) +
          '<span id="df-file-label">Klik atau tarik Foto (.PNG/.JPG) atau Video (.MP4/.WEBM) bukti bug / ban / karya</span>' +
          '<input type="file" id="df-file" accept="image/*,video/*" /></label>' +
          '<div class="preview-box hidden" id="df-preview"></div>' +
          '<span class="hint" id="df-hint">Mendukung pemutaran video langsung dan zoom foto resolusi penuh di thread forum.</span></div>' +

          '<div class="field"><label class="label" for="df-body">Isi Keluhan / Kronologi Lengkap</label>' +
          '<textarea class="textarea" id="df-body" maxlength="2400" placeholder="Ceritakan kronologi lengkap, dampak ke game/penghasilan Robux kamu, atau lampirkan bukti…" required></textarea></div>' +
          '<div class="err hidden" id="df-err"></div>',
        actions: [
          { label: 'Batal', cls: 'btn-ghost' },
          {
            label: 'Posting ke Forum Keluhan', cls: 'btn-danger', onClick: async function (close, overlay) {
              const errBox = overlay.querySelector('#df-err');
              errBox.classList.add('hidden');
              const tScan = S.sanitize(overlay.querySelector('#df-title').value.trim());
              const bScan = S.sanitize(overlay.querySelector('#df-body').value.trim());
              if (tScan.flags.length || bScan.flags.length) {
                UI.toast('Restricted government ID pattern redacted.', 'warn');
                S.logViolation(me.usn, 'PII_REDACTED', 'Forum post contained restricted ID pattern.');
              }
              if (!tScan.clean || !bScan.clean) {
                errBox.textContent = 'Judul dan isi keluhan wajib diisi.';
                errBox.classList.remove('hidden');
                return;
              }
              let media = null;
              if (fState.file) {
                const vaultId = S.uuid('frm_med');
                await Core.Vault.put(vaultId, fState.file, { dimensions: fState.dimensions, duration: fState.duration });
                media = {
                  kind: /^image\//.test(fState.file.type) ? 'image' : 'video',
                  vaultId: vaultId,
                  name: fState.file.name,
                  size: fState.file.size,
                  mime: fState.file.type,
                  dimensions: fState.dimensions,
                  duration: fState.duration
                };
              }
              const fBoard = overlay.querySelector('#df-board').value;
              const fSev = overlay.querySelector('#df-sev').value;
              Store.insert('queue', {
                id: S.uuid('sub_frm'),
                postType: 'forum',
                creatorUSN: me.usn,
                creatorRole: me.role,
                title: tScan.clean.slice(0, 95),
                board: fBoard,
                category: fBoard,
                severity: fSev,
                desc: bScan.clean.slice(0, 2400),
                body: bScan.clean.slice(0, 2400),
                version: 'Forum Thread',
                license: 'Community Complaint / Discussion',
                price: 0,
                tags: [fSev === 'critical' ? '🚨 Fatal' : fSev === 'annoying' ? '😤 Emosi' : '💬 Diskusi'],
                media: media,
                state: 'pending',
                reviewBy: null,
                lockAt: null,
                createdAt: Date.now()
              });
              Core.Audit.log(me.usn, 'FORUM_QUEUED', 'Queued complaint thread "' + tScan.clean.slice(0, 50) + '" (' + me.role + ') for moderation.');
              close();
              UI.toast('Thread Keluhan masuk ke Antrean Moderasi (Queue)! Menunggu verifikasi sebelum tampil di Forum.', 'info');
              Modules.Main.render();
            }
          }
        ]
      });

      const overlay = document.querySelector('#modals .modal-overlay:last-child');
      if (!overlay) return;
      const fileInput = overlay.querySelector('#df-file');
      const preview = overlay.querySelector('#df-preview');
      const label = overlay.querySelector('#df-file-label');
      const hint = overlay.querySelector('#df-hint');
      const errBox = overlay.querySelector('#df-err');

      fileInput.addEventListener('change', function () {
        const f = fileInput.files && fileInput.files[0];
        if (!f) return;
        errBox.classList.add('hidden');
        const isImg = /^image\//.test(f.type);
        const isVid = /^video\//.test(f.type);
        if (!isImg && !isVid) {
          errBox.textContent = 'Hanya file foto (image/*) dan video (video/*) yang didukung.';
          errBox.classList.remove('hidden');
          fileInput.value = '';
          return;
        }
        if (isImg && f.size > CFG.LIMITS.imgBytes) {
          errBox.textContent = 'Ukuran foto melebihi batas 5 MB (' + UI.fmtBytes(f.size) + ').';
          errBox.classList.remove('hidden');
          fileInput.value = '';
          return;
        }
        if (isVid && f.size > CFG.LIMITS.vidBytes) {
          errBox.textContent = 'Ukuran video melebihi batas 3 MB (' + UI.fmtBytes(f.size) + ').';
          errBox.classList.remove('hidden');
          fileInput.value = '';
          return;
        }
        fState.file = f;
        if (fState.previewUrl) URL.revokeObjectURL(fState.previewUrl);
        fState.previewUrl = URL.createObjectURL(f);

        preview.classList.remove('hidden');
        if (isImg) {
          preview.innerHTML = '<img id="df-img-prev" src="' + fState.previewUrl + '" alt="Preview" />';

            fState.dimensions = ev.target.naturalWidth + '×' + ev.target.naturalHeight + 'px';
            hint.textContent = 'Siap diunggah: ' + fState.dimensions + ' · ' + UI.fmtBytes(f.size);
          };
        } else {
          preview.innerHTML = '<video id="df-vid-prev" src="' + fState.previewUrl + '" controls muted playsinline></video>';
          preview.querySelector('#df-vid-prev').onloadedmetadata = function (ev) {
            fState.dimensions = (ev.target.videoWidth || 0) + '×' + (ev.target.videoHeight || 0) + 'px';
            fState.duration = Math.round(ev.target.duration || 0);
            hint.textContent = 'Siap diunggah: ' + fState.dimensions + ' · ' + fState.duration + 's · ' + UI.fmtBytes(f.size);
          };
        }
      });
    }

    function sevBadge(sev) {
      if (sev === 'critical') return '<span class="severity-pill" data-sev="critical">🚨 Keluhan Fatal</span>';
      if (sev === 'annoying') return '<span class="severity-pill" data-sev="annoying">😤 Bikin Emosi</span>';
      return '<span class="severity-pill" data-sev="discussion">💬 Diskusi / Media</span>';
    }

    function paintForum() {
      const freshThreads = Store.list('forum').sort(function (a, b) { return b.at - a.at; });
      let list = freshThreads.slice();
      if (state.board) list = list.filter(function (t) { return t.board === state.board; });
      if (state.q) {
        const q = state.q.toLowerCase();
        list = list.filter(function (t) { return (t.title + ' ' + t.body + ' ' + t.authorUSN + ' ' + t.board).toLowerCase().includes(q); });
      }
      if (state.sort === 'hot') {
        list.sort(function (a, b) {
          const scoreA = ((a.upvotes && a.upvotes.length) || 0) * 2 + ((a.replies && a.replies.length) || 0);
          const scoreB = ((b.upvotes && b.upvotes.length) || 0) * 2 + ((b.replies && b.replies.length) || 0);
          return scoreB - scoreA || (b.at - a.at);
        });
      } else {
        list.sort(function (a, b) { return b.at - a.at; });
      }

      const host = container.querySelector('#df-list');
      if (!freshThreads.length) {
        host.innerHTML = UI.emptyState(
          'flame',
          'No active listings found. Start showcasing your work!',
          'Belum ada keluhan yang diposting. Kesal dengan pajak 30% Roblox, false ban AI moderasi, atau bug physics Studio? Posting keluhan + bukti foto/videomu sekarang!',
          me
            ? '<button type="button" class="btn btn-danger" id="df-empty-new">' + UI.icon('flame', 15) + ' Tulis Keluhan Pertama</button>'
            : '<a class="btn btn-primary" href="#/auth?mode=register">Buat Akun untuk Mengeluh</a>'
        );
        const eb = host.querySelector('#df-empty-new');
        if (eb) eb.addEventListener('click', openForumComposer);
        return;
      }
      if (!list.length) {
        host.innerHTML = UI.emptyState('search', 'Tidak ada thread yang cocok', 'Ubah filter kategori keluhan atau kata kunci pencarian.');
        return;
      }

      host.innerHTML = '<div class="col">' + list.map(function (t) {
        const author = Store.get('users', t.authorUSN);
        const upvotes = t.upvotes || [];
        const voted = me && upvotes.indexOf(me.usn) !== -1;
        return '<div class="card" data-thread-id="' + S.esc(t.id) + '">' +
          '<div class="card-head"><div class="row wrap">' + sevBadge(t.severity || 'critical') + UI.chip(t.board) + '<h3>' + S.esc(S.guard(t.title)) + '</h3></div>' +
          '<span class="muted" style="font-size:12px">' + S.esc(UI.timeAgo(t.at)) + '</span></div>' +
          '<div class="card-body col" style="gap:12px">' +
          (t.media ? UI.mediaNode(t.media, 'media-box', true, t.id) : '') +
          '<p class="muted" style="white-space:pre-wrap;font-size:13.8px">' + S.esc(S.guard(t.body)) + '</p>' +
          '<div class="row between wrap" style="margin-top:4px;padding-top:10px;border-top:1px solid var(--line-soft)">' +
          '<a class="row" href="#/u/' + S.esc(t.authorUSN) + '" style="color:inherit">' + UI.avatar(author, 26) +
          '<span class="mono">@' + S.esc(t.authorUSN) + '</span> ' + (author ? UI.roleBadge(author.role) : '') + '</a>' +
          '<div class="row wrap">' +
          '<button type="button" class="rant-btn' + (voted ? ' voted' : '') + '" data-upvote-thread="' + S.esc(t.id) + '">' +
          UI.icon('flame', 14) + ' <span>Ikut Kesal / Relate (' + upvotes.length + ')</span></button>' +
          '</div></div>' +
          UI.renderTikTokComments('forum', t.id, t.authorUSN, t.replies || [], me) +
          '</div></div>';
      }).join('') + '</div>';

      UI.hydrateMedia(host);
    }

    container.innerHTML =
      '<div class="view">' +
      '<div class="composer-banner forum-rant">' +
      '<div><div class="row" style="gap:8px;margin-bottom:4px">' + UI.tonePill('ROBLOX RANT & MULTIMEDIA FORUM', 'bad') + '<span class="mono muted">Bebas Foto (&le;5MB) & Video (&le;3MB)</span></div>' +
      '<h1 class="view-title">' + UI.icon('flame', 22) + ' Forum Keluhan & Curhat Creator Roblox</h1>' +
      '<p class="view-sub">Tempat para developer & kreator menumpahkan keluhan soal Roblox (moderasi AI ngawur, pajak 30%, DevEx, server lag, hingga algoritma) lengkap dengan bukti foto atau video bebas.</p></div>' +
      (me
        ? '<button type="button" class="btn btn-danger" id="df-new">' + UI.icon('flame', 15) + ' Buat Keluhan / Post Media</button>'
        : '<a class="btn btn-primary" href="#/auth">Sign In untuk Posting</a>') +
      '</div>' +

      (function () {
        const qCount = Store.count('queue', function (q) { return q.postType === 'forum'; });
        const canMod = me && Core.RBAC.can(me.role, 'queue.view');
        if (!qCount) return '';
        return '<div class="queue-pending-strip">' +
          '<div class="row" style="gap:8px">' + UI.icon('clock', 16) +
          '<span><strong>' + qCount + ' Postingan Forum Keluhan</strong> sedang berada di <strong>Moderation Queue</strong> (termasuk milik User/Moderator/Owner) menunggu persetujuan.</span></div>' +
          (canMod
            ? '<a class="btn btn-sm btn-primary" href="#/queue">' + UI.icon('shieldCheck', 14) + ' Buka Mod Queue & Approve (' + qCount + ')</a>'
            : (me ? '<a class="btn btn-sm btn-ghost" href="#/workspace">Lihat Antrean Saya di Workspace</a>' : '')) +
          '</div>';
      })() +
      '<div class="filters">' +
      '<input class="input search" id="df-q" placeholder="Cari topik keluhan, bug Studio, pajak Robux, atau @kreator…" />' +
      '<select class="select" id="df-board-filter"><option value="">Semua Topik Keluhan</option>' +
      CFG.FORUM_BOARDS.map(function (b) { return '<option value="' + S.esc(b) + '">' + S.esc(b) + '</option>'; }).join('') + '</select>' +
      '<select class="select" id="df-sort"><option value="hot">Paling Banyak Dikeluhkan (Hot)</option><option value="new">Terbaru</option></select>' +
      '</div><div id="df-list"></div></div>';

    const newBtn = container.querySelector('#df-new');
    if (newBtn) newBtn.addEventListener('click', openForumComposer);
    container.querySelector('#df-q').addEventListener('input', function (e) { state.q = e.target.value.trim(); paintForum(); });
    container.querySelector('#df-board-filter').addEventListener('change', function (e) { state.board = e.target.value; paintForum(); });
    container.querySelector('#df-sort').addEventListener('change', function (e) { state.sort = e.target.value; paintForum(); });

    const listHost = container.querySelector('#df-list');
    listHost.addEventListener('click', function (e) {
      const expandBtn = e.target.closest('[data-expand-media]');
      if (expandBtn) {
        const trd = Store.get('forum', expandBtn.dataset.expandMedia);
        if (trd) {
          UI.inspectMediaModal({
            title: trd.title,
            creatorUSN: trd.authorUSN,
            category: trd.board,
            version: 'Forum Media',
            license: 'Community Post',
            price: 0,
            desc: trd.body,
            media: trd.media
          });
        }
        return;
      }
      const upBtn = e.target.closest('[data-upvote-thread]');
      if (upBtn) {
        if (!me) { UI.toast('Sign in untuk ikut vote keluhan ini.', 'warn'); Modules.Main.navigate('/auth'); return; }
        const id = upBtn.dataset.upvoteThread;
        const trd = Store.get('forum', id);
        if (!trd) return;
        const arr = (trd.upvotes || []).slice();
        const idx = arr.indexOf(me.usn);
        if (idx === -1) arr.push(me.usn); else arr.splice(idx, 1);
        Store.update('forum', id, { upvotes: arr });
        paintForum();
        return;
      }
      const replyBtn = e.target.closest('[data-df-reply]');
      if (replyBtn && me) {
        const id = replyBtn.dataset.dfReply;
        const inp = listHost.querySelector('[data-df-input="' + id + '"]');
        const scan = S.sanitize(inp.value.trim());
        if (!scan.clean) { UI.toast('Balasan tidak boleh kosong.', 'warn'); return; }
        if (scan.flags.length) UI.toast('Restricted identifier pattern stripped from reply.', 'warn');
        const trd = Store.get('forum', id);
        if (!trd) return;
        const replies = (trd.replies || []).concat([{ by: me.usn, text: scan.clean.slice(0, 800), at: Date.now() }]);
        Store.update('forum', id, { replies: replies });
        UI.toast('Balasan terkirim.', 'success');
        paintForum();
      }
    });

    UI.wireTikTokComments(listHost, paintForum);
    paintForum();
  }

  return Object.freeze({
    viewMarket: viewMarket,
    viewAsset: viewAsset,
    viewForum: viewForum,
    openShowcaseComposer: openShowcaseComposer,
    cardHTML: cardHTML,
    wireGrid: wireGrid,
    handleBuy: handleBuy
  });
});

'use strict';
/* ============================================================================
   RCP STAFF, MODERATION STUDIO & CAGM MODULE (v4.0)

     video player, image lightbox zoom, MIME/size/resolution badges, and Luau
     code manifest inspection).
   - Concurrent staff review lock (`Under Review by Staff [Username]`).
