<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0A0B0F" />
  <meta name="description" content="RCP — Roblox Creator Platform. Enterprise 100% client-side portfolio, DevForum, and signed asset marketplace for Roblox creators." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>RCP — Roblox Creator Platform</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235E17FF'/%3E%3Cg transform='rotate(14 47 52)'%3E%3Cpath fill-rule='evenodd' d='M22 27H72V77H22V27ZM41 46V58H53V46H41Z' fill='%23FFFFFF'/%3E%3C/g%3E%3C/svg%3E" />
  <style>
/* ==========================================================================
   RCP — ROBLOX CREATOR PLATFORM · ENTERPRISE PRODUCTION DESIGN SYSTEM (v4.0)
   Palette: Deep Obsidian (#0D0E10) · Sleek Charcoal (#16181C) · Slate (#23262D)
   Accents: Electric Roblox Blue (#0084FF) · Emerald Green (#00E676)
   Radii locked to 6px–8px. Clean, contemporary ArtStation / Stripe / DevForum feel.
   ========================================================================== */

:root {
  --obsidian: #0D0E10;
  --charcoal: #16181C;
  --charcoal-elev: #1B1E24;
  --slate: #23262D;
  --slate-hover: #2C3039;
  --line: #2E323B;
  --line-soft: #242830;
  --text: #F1F3F7;
  --muted: #9AA3AF;
  --faint: #68707C;
  --blue: #0084FF;
  --blue-hover: #1E94FF;
  --blue-dim: rgba(0, 132, 255, 0.14);
  --green: #00E676;
  --green-hover: #22F08B;
  --green-dim: rgba(0, 230, 118, 0.13);
  --red: #FF4757;
  --red-dim: rgba(255, 71, 87, 0.14);
  --amber: #FFC400;
  --amber-dim: rgba(255, 196, 0, 0.14);
  --violet: #8B5CF6;
  --violet-dim: rgba(139, 92, 246, 0.14);
  --logo-violet: #5B19FF;
  --r-sm: 6px;
  --r-md: 8px;
  --shadow-1: 0 2px 6px rgba(0, 0, 0, 0.38);
  --shadow-2: 0 12px 32px rgba(0, 0, 0, 0.55);
  --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --side-w: 256px;
  --side-w-mini: 70px;
  --top-h: 62px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
}

body {
  background: var(--obsidian);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection {
  background: var(--blue-dim);
  color: var(--text);
}

a {
  color: var(--blue);
  text-decoration: none;
}
a:hover {
  text-decoration: none;
}

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; }
.spacer { flex: 1; }
.hidden { display: none !important; }

/* ---------- Boot Splash ---------- */
#splash {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: var(--obsidian);
  transition: opacity 0.25s ease;
}
#splash.gone {
  opacity: 0;
  pointer-events: none;
}
.splash-text {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 0.04em;
}

/* ---------- Sticky Topbar ---------- */
[data-anchor="topbar"] {
  position: sticky;
  top: 0;
  z-index: 60;
  height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: rgba(13, 14, 16, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-soft);
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  color: var(--text);
}
.brand-name {
  font-weight: 800;
  font-size: 15.5px;
  letter-spacing: 0.02em;
  line-height: 1.15;
}
.brand-name small {
  display: block;
  font-weight: 500;
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.topbar-quicksearch {
  flex: 1;
  max-width: 420px;
  position: relative;
  margin-left: 12px;
}
.topbar-quicksearch input {
  width: 100%;
  background: var(--charcoal);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 7px 12px 7px 34px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  transition: border-color 0.14s ease, box-shadow 0.14s ease;
}
.topbar-quicksearch input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-dim);
}
.topbar-quicksearch .qs-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--faint);
  pointer-events: none;
}
.session-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 11px 5px 6px;
  background: var(--charcoal);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text);
  transition: border-color 0.14s ease;
}
.session-chip:hover {
  border-color: var(--blue);
}
.session-chip .who {
  font-weight: 600;
  font-size: 12.5px;
  line-height: 1.2;
}

/* ---------- Frame & Collapsible Sidebar ---------- */
[data-anchor="frame"] {
  display: flex;
  min-height: calc(100vh - var(--top-h));
}

[data-anchor="sidebar"] {
  width: var(--side-w);
  flex: 0 0 auto;
  position: sticky;
  top: var(--top-h);
  height: calc(100vh - var(--top-h));
  display: flex;
  flex-direction: column;
  background: var(--charcoal);
  border-right: 1px solid var(--line-soft);
  padding: 12px 10px;
  gap: 4px;
  overflow-y: auto;
  transition: width 0.18s ease;
}
body[data-side="mini"] [data-anchor="sidebar"] {
  width: var(--side-w-mini);
}
body[data-side="mini"] .side-link .txt,
body[data-side="mini"] .side-link .count,
body[data-side="mini"] .side-section,
body[data-side="mini"] .side-foot .foot-txt {
  display: none;
}
body[data-side="mini"] .side-link {
  justify-content: center;
}

.side-section {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 14px 10px 4px;
}
.side-link {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 11px;
  border-radius: var(--r-md);
  color: var(--muted);
  font-weight: 560;
  font-size: 13.5px;
  border: 1px solid transparent;
  transition: background 0.13s ease, color 0.13s ease, border-color 0.13s ease;
}
.side-link:hover {
  background: var(--slate);
  color: var(--text);
}
.side-link.active {
  background: var(--blue-dim);
  color: var(--text);
  border-color: rgba(0, 132, 255, 0.35);
}
.side-link.active svg {
  color: var(--blue);
}
.side-link .count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  background: var(--slate);
  color: var(--muted);
  border-radius: 999px;
  padding: 1px 8px;
}
.side-link.active .count {
  background: var(--blue);
  color: #04101F;
}
.side-foot {
  margin-top: auto;
  padding: 10px 6px 4px;
  border-top: 1px solid var(--line-soft);
}

[data-anchor="scrim"] {
  position: fixed;
  inset: 0;
  z-index: 55;
  background: rgba(0, 0, 0, 0.58);
}

[data-anchor="viewport"] {
  flex: 1;
  min-width: 0;
  padding: 24px clamp(16px, 3vw, 36px) 64px;
}

/* ---------- View Layout ---------- */
.view {
  max-width: 1260px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}
.view-title {
  font-size: 21px;
  font-weight: 780;
  letter-spacing: -0.015em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.view-sub {
  color: var(--muted);
  font-size: 13px;
  margin-top: 3px;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 15px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--slate);
  color: var(--text);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 640;
  cursor: pointer;
  transition: background 0.14s ease, border-color 0.14s ease, transform 0.06s ease;
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  background: var(--slate-hover);
  border-color: #3D434F;
}
.btn:active:not(:disabled) {
  transform: translateY(1px);
}
.btn:disabled {
  opacity: 0.48;
  cursor: not-allowed;
}
.btn-primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #FFFFFF;
}
.btn-primary:hover:not(:disabled) {
  background: var(--blue-hover);
  border-color: var(--blue-hover);
}
.btn-success {
  background: var(--green);
  border-color: var(--green);
  color: #04150B;
  font-weight: 700;
}
.btn-success:hover:not(:disabled) {
  background: var(--green-hover);
  border-color: var(--green-hover);
}
.btn-danger {
  background: var(--red-dim);
  border-color: rgba(255, 71, 87, 0.45);
  color: var(--red);
}
.btn-danger:hover:not(:disabled) {
  background: rgba(255, 71, 87, 0.24);
}
.btn-ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--muted);
}
.btn-ghost:hover:not(:disabled) {
  color: var(--text);
  background: var(--slate);
}
.btn-sm {
  padding: 6px 11px;
  font-size: 12.5px;
  border-radius: var(--r-sm);
}
.btn-block {
  width: 100%;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--r-md);
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.14s ease, color 0.14s ease;
}
.icon-btn:hover {
  background: var(--slate);
  color: var(--text);
}
.icon-btn.logout-red {
  color: var(--red);
  background: rgba(255, 71, 87, 0.08);
  border-color: rgba(255, 71, 87, 0.25);
}
.icon-btn.logout-red:hover {
  background: rgba(255, 71, 87, 0.2);
  color: #FF6B78;
}

/* ---------- Cards & Grids ---------- */
.card {
  background: var(--charcoal);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  overflow: hidden;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line-soft);
}
.card-head h3 {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-body {
  padding: 16px;
}
.card-body.tight {
  padding: 13px;
}

.grid-telemetry {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
}
.tele-card {
  background: var(--charcoal);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.tele-num {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-family: var(--mono);
}
.tele-num.accent-b { color: var(--blue); }
.tele-num.accent-g { color: var(--green); }
.tele-num.accent-a { color: var(--amber); }
.tele-label {
  font-size: 11.5px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 650;
}

.grid-market {
  display: grid;
  gap: 15px;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
}
.grid-2 {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
}
.grid-3 {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

/* ---------- Marketplace Asset Cards ---------- */
.asset-card {
  position: relative;
  background: var(--charcoal);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.asset-card:hover {
  border-color: #3D434F;
  transform: translateY(-2px);
}
.asset-card.flagged {
  border-color: var(--red);
  box-shadow: 0 0 0 1px var(--red);
}
.asset-card.is-claiming {
  opacity: 0.78;
}
.asset-media {
  position: relative;
  aspect-ratio: 16 / 10;
  background: var(--slate);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.asset-media img, .asset-media video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.asset-media .no-media {
  color: var(--faint);
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  font-size: 12px;
}
.overlay-sold {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(13, 14, 16, 0.76);
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--muted);
  font-size: 13px;
}
.media-kind {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 2;
  background: rgba(13, 14, 16, 0.85);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.media-expand-btn {
  position: absolute;
  bottom: 8px;
  right: 8px;
  z-index: 3;
  background: rgba(13, 14, 16, 0.86);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 11px;
  font-weight: 650;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.media-expand-btn:hover {
  border-color: var(--blue);
  color: var(--blue);
}
.asset-body {
  padding: 13px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  flex: 1;
}
.asset-title {
  font-size: 14.5px;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: anywhere;
}
.asset-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px;
  flex-wrap: wrap;
}
.asset-foot {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.price-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--green-dim);
  color: var(--green);
  border: 1px solid rgba(0, 230, 118, 0.32);
  font-weight: 750;
  font-size: 12.5px;
  font-family: var(--mono);
  padding: 3px 9px;
  border-radius: var(--r-sm);
}
.price-badge.free {
  background: var(--blue-dim);
  color: var(--blue);
  border-color: rgba(0, 132, 255, 0.32);
}

/* ---------- Chips / Pills / Role Badges ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--slate);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 620;
  padding: 2.5px 9px;
  border-radius: 999px;
}
.chip-toggle {
  cursor: pointer;
  user-select: none;
  transition: all 0.13s ease;
}
.chip-toggle:hover {
  color: var(--text);
  border-color: #3D434F;
}
.chip-toggle.active {
  background: var(--blue-dim);
  border-color: var(--blue);
  color: var(--blue);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 680;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--slate);
  border: 1px solid var(--line);
  color: var(--muted);
}
.pill[data-status="available"] { background: var(--green-dim); border-color: rgba(0, 230, 118, 0.35); color: var(--green); }
.pill[data-status="wrapping"] { background: var(--amber-dim); border-color: rgba(255, 196, 0, 0.35); color: var(--amber); }
.pill[data-status="full"] { background: var(--red-dim); border-color: rgba(255, 71, 87, 0.35); color: var(--red); }
.pill[data-tone="ok"] { background: var(--green-dim); border-color: rgba(0, 230, 118, 0.35); color: var(--green); }
.pill[data-tone="warn"] { background: var(--amber-dim); border-color: rgba(255, 196, 0, 0.35); color: var(--amber); }
.pill[data-tone="bad"] { background: var(--red-dim); border-color: rgba(255, 71, 87, 0.35); color: var(--red); }
.pill[data-tone="info"] { background: var(--blue-dim); border-color: rgba(0, 132, 255, 0.35); color: var(--blue); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 2.5px 8px;
  border-radius: var(--r-sm);
  background: var(--slate);
  border: 1px solid var(--line);
  color: var(--muted);
}
.badge[data-role="owner"] { background: var(--green); border-color: var(--green); color: #04140B; }
.badge[data-role="coowner"] { background: var(--green-dim); border-color: rgba(0, 230, 118, 0.4); color: var(--green); }
.badge[data-role="moderator"] { background: var(--blue-dim); border-color: rgba(0, 132, 255, 0.4); color: var(--blue); }
.badge[data-role="exclusive"] { background: var(--violet-dim); border-color: rgba(139, 92, 246, 0.45); color: var(--violet); }

/* ---------- Avatars & Profile Storefront ---------- */
.avatar {
  border-radius: var(--r-md);
  background: var(--slate);
  border: 1px solid var(--line);
  object-fit: cover;
  flex: 0 0 auto;
  display: block;
}
.avatar-lg {
  width: 96px;
  height: 96px;
  border-radius: 10px;
}

.profile-head {
  position: relative;
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--line-soft);
  background: var(--charcoal);
}
.banner {
  height: 132px;
  background: var(--slate);
  position: relative;
}
.banner[data-pattern="plain"] {
  background: linear-gradient(120deg, var(--accent, var(--blue)) 0%, rgba(0, 0, 0, 0) 85%), var(--slate);
}
.banner[data-pattern="grid"] {
  background:
    linear-gradient(120deg, var(--accent, var(--blue)) 0%, rgba(0, 0, 0, 0) 70%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 26px),
    var(--slate);
}
.banner[data-pattern="dots"] {
  background:
    linear-gradient(120deg, var(--accent, var(--blue)) 0%, rgba(0, 0, 0, 0) 70%),
    radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1.6px),
    var(--slate);
  background-size: auto, 18px 18px, auto;
}
.banner[data-pattern="waves"] {
  background:
    linear-gradient(120deg, var(--accent, var(--blue)) 0%, rgba(0, 0, 0, 0) 70%),
    repeating-radial-gradient(circle at 0 100%, transparent 0 22px, rgba(255, 255, 255, 0.05) 22px 23px),
    var(--slate);
}
.profile-id {
  display: flex;
  gap: 16px;
  padding: 0 20px 18px;
  align-items: flex-end;
  flex-wrap: wrap;
}
.profile-id .avatar-lg {
  margin-top: -46px;
  box-shadow: 0 0 0 4px var(--charcoal);
}
.profile-names {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 2px;
  min-width: 0;
}
.display-name {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}
.usn-line {
  color: var(--muted);
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.profile-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 2px;
}

/* ---------- Forms & Inputs ---------- */
.form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.label {
  font-size: 12px;
  font-weight: 680;
  color: var(--muted);
  letter-spacing: 0.02em;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.label .counter {
  font-weight: 550;
  color: var(--faint);
  font-size: 11px;
  font-family: var(--mono);
}
.input, .select, .textarea {
  width: 100%;
  background: var(--obsidian);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 9.5px 12px;
  font-family: inherit;
  font-size: 13.5px;
  transition: border-color 0.13s ease, box-shadow 0.13s ease;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-dim);
}
.input::placeholder, .textarea::placeholder {
  color: var(--faint);
}
.textarea {
  resize: vertical;
  min-height: 92px;
}
.textarea.code-editor {
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.5;
  background: #0A0B0D;
}
.select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 30px;
}
.hint {
  font-size: 11.5px;
  color: var(--faint);
}
.err {
  font-size: 12.5px;
  color: var(--red);
  background: var(--red-dim);
  border: 1px solid rgba(255, 71, 87, 0.35);
  padding: 8px 11px;
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  gap: 6px;
}

.file-drop {
  border: 1.5px dashed var(--line);
  border-radius: var(--r-md);
  padding: 20px;
  text-align: center;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: var(--obsidian);
  cursor: pointer;
  transition: border-color 0.14s ease, background 0.14s ease;
}
.file-drop:hover, .file-drop.drag {
  border-color: var(--blue);
  color: var(--text);
  background: rgba(0, 132, 255, 0.04);
}
.file-drop input[type="file"] {
  display: none;
}
.preview-box {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  background: #050607;
}
.preview-box img, .preview-box video {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  display: block;
}

.segmented {
  display: inline-flex;
  background: var(--obsidian);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 3px;
  gap: 3px;
  flex-wrap: wrap;
}
.seg-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 640;
  padding: 7px 13px;
  border-radius: var(--r-sm);
  cursor: pointer;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active { background: var(--slate); color: var(--text); border-color: var(--line); }
.seg-btn.active[data-status="available"] { color: var(--green); border-color: rgba(0, 230, 118, 0.4); }
.seg-btn.active[data-status="wrapping"] { color: var(--amber); border-color: rgba(255, 196, 0, 0.4); }
.seg-btn.active[data-status="full"] { color: var(--red); border-color: rgba(255, 71, 87, 0.4); }

.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: var(--r-sm); border: 2px solid transparent; cursor: pointer; }
.swatch.active { border-color: var(--text); transform: scale(1.06); }

/* ---------- Tables ---------- */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
}
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.8px;
  min-width: 640px;
}
.table th {
  text-align: left;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 700;
  padding: 10px 13px;
  background: var(--slate);
  border-bottom: 1px solid var(--line);
}
.table td {
  padding: 10px 13px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: rgba(255, 255, 255, 0.02); }

/* ---------- Moderation Queue Inspection Studio ---------- */
.queue-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.queue-card {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 16px;
  background: var(--charcoal);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  overflow: hidden;
  padding: 14px;
}
.queue-card.in-review-mine {
  border-color: rgba(0, 132, 255, 0.5);
  box-shadow: 0 0 0 1px rgba(0, 132, 255, 0.25);
}
.queue-media-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.queue-media-col .asset-media {
  aspect-ratio: 16 / 10;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: #060709;
}
.media-meta-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--muted);
  background: var(--obsidian);
  border: 1px solid var(--line-soft);
  padding: 6px 8px;
  border-radius: var(--r-sm);
}
.lock-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--amber-dim);
  border: 1px solid rgba(255, 196, 0, 0.35);
  color: var(--amber);
  font-size: 12px;
  font-weight: 650;
  padding: 8px 12px;
  border-radius: var(--r-sm);
}
.lock-banner.mine {
  background: var(--blue-dim);
  border-color: rgba(0, 132, 255, 0.4);
  color: var(--blue);
}
.code-snippet-box {
  background: #08090B;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 12px;
  color: #D1D5DB;
  max-height: 180px;
  overflow: auto;
  white-space: pre-wrap;
}

/* ---------- Empty State Component ---------- */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 48px 24px;
  text-align: center;
  background: var(--charcoal);
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  color: var(--muted);
}
.empty-icon { color: var(--faint); opacity: 0.85; }
.empty-title { font-size: 15.5px; font-weight: 720; color: var(--text); }
.empty-msg { font-size: 13px; max-width: 440px; }

/* ---------- Modals, Media Lightbox & Toasts ---------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 120;
  background: rgba(5, 6, 8, 0.76);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  animation: fadeIn 0.15s ease;
}
.modal {
  width: min(560px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--charcoal);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
  animation: popIn 0.15s ease;
}
.modal.wide {
  width: min(860px, 100%);
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.modal-head h3 { font-size: 15px; font-weight: 720; }
.modal-body {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  padding: 13px 18px;
  border-top: 1px solid var(--line-soft);
  flex-wrap: wrap;
}

#toasts {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  gap: 9px;
  max-width: 370px;
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--slate);
  border: 1px solid var(--line);
  border-left: 3px solid var(--blue);
  border-radius: var(--r-md);
  padding: 11px 14px;
  font-size: 13px;
  box-shadow: var(--shadow-2);
  animation: slideIn 0.18s ease;
}
.toast.success { border-left-color: var(--green); }
.toast.error { border-left-color: var(--red); }
.toast.warn { border-left-color: var(--amber); }
.toast svg { flex: 0 0 auto; margin-top: 1px; }
.toast.success svg { color: var(--green); }
.toast.error svg { color: var(--red); }
.toast.warn svg { color: var(--amber); }
.toast.info svg { color: var(--blue); }

/* ---------- Misc Components ---------- */
.check-list { display: flex; flex-direction: column; gap: 9px; }
.check-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.check-item .box {
  width: 19px; height: 19px; flex: 0 0 auto; border-radius: 5px;
  border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center;
  color: transparent;
}
.check-item.done { color: var(--text); }
.check-item.done .box { background: var(--green); border-color: var(--green); color: #04140B; }
.progress { height: 6px; background: var(--slate); border-radius: 999px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); border-radius: 999px; transition: width 0.3s ease; }

.handbook { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.hand-card { background: var(--charcoal); border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 15px 16px; display: flex; flex-direction: column; gap: 7px; }
.hand-card h4 { font-size: 13.5px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.hand-card h4 svg { color: var(--blue); }
.hand-card p { font-size: 12.5px; color: var(--muted); }

.copy-box {
  display: flex; align-items: center; gap: 9px;
  background: var(--obsidian); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 10px 12px;
  font-family: var(--mono); font-size: 12.5px; color: var(--green);
  overflow-wrap: anywhere;
}

.footer-note {
  margin-top: 26px; padding-top: 15px; border-top: 1px solid var(--line-soft);
  color: var(--faint); font-size: 11.5px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
}

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.tab {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 650;
  padding: 9px 14px; cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--blue); }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters .input, .filters .select { width: auto; min-width: 150px; }
.filters .search { flex: 1; min-width: 190px; }

.media-box { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: #050608; }
.media-box img, .media-box video { width: 100%; max-height: 460px; object-fit: contain; display: block; }

.thread { display: flex; flex-direction: column; gap: 9px; }
.thread-msg { background: var(--obsidian); border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 10px 12px; font-size: 12.8px; }
.thread-msg .by { font-weight: 700; font-size: 11.5px; color: var(--blue); }
.thread-msg.staff .by { color: var(--green); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

@media (max-width: 960px) {
  [data-anchor="sidebar"] {
    position: fixed; left: 0; top: var(--top-h); z-index: 56;
    width: var(--side-w) !important;
    transform: translateX(-102%); transition: transform 0.2s ease;
    box-shadow: var(--shadow-2);
  }
  body.side-open [data-anchor="sidebar"] { transform: none; }
  body[data-side="mini"] .side-link .txt,
  body[data-side="mini"] .side-section,
  body[data-side="mini"] .side-foot .foot-txt { display: block; }
  body[data-side="mini"] .side-link { justify-content: flex-start; }
  .queue-card { grid-template-columns: 1fr; }
  .topbar-quicksearch { display: none; }
}

@media (max-width: 560px) {
  .grid-market { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
  .profile-id { align-items: flex-start; }
  .profile-actions { margin-left: 0; }
  [data-anchor="viewport"] { padding: 16px 12px 50px; }
}


/* ---------- Interactive Card & Row Affordances (v4.1) ---------- */
.tele-card[data-nav],
.hand-card[data-handbook],
.check-item[data-nav],
.creator-dir-card {
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
}
.tele-card[data-nav]:hover,
.hand-card[data-handbook]:hover,
.creator-dir-card:hover {
  border-color: var(--blue);
  transform: translateY(-2px);
  background: var(--charcoal-elev);
}
.check-item[data-nav] {
  padding: 6px 8px;
  border-radius: var(--r-sm);
}
.check-item[data-nav]:hover {
  background: var(--slate);
  color: var(--text);
}
.asset-media[data-open-asset],
.asset-title[data-open-asset] {
  cursor: pointer;
}
.asset-title[data-open-asset]:hover {
  color: var(--blue);
}
.pill[data-nav],
.chip[data-nav] {
  cursor: pointer;
}
.pill[data-nav]:hover,
.chip[data-nav]:hover {
  border-color: var(--blue);
  color: var(--text);
}


/* ---------- v4.2 Showcase Wall (Dashboard) & Complaint Forum Styling ---------- */
.showcase-grid {
  display: grid;
  gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
}
.showcase-card {
  background: var(--charcoal);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.16s ease, transform 0.16s ease;
}
.showcase-card:hover {
  border-color: #3D434F;
  transform: translateY(-2px);
}
.showcase-card .asset-media {
  aspect-ratio: 16 / 10;
  background: #07080A;
}
.showcase-body {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}
.showcase-caption {
  font-size: 13.5px;
  color: var(--muted);
  white-space: pre-wrap;
  line-height: 1.5;
}
.like-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--slate);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 680;
  padding: 5px 11px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.14s ease;
}
.like-btn:hover {
  border-color: var(--blue);
  color: var(--text);
}
.like-btn.liked {
  background: rgba(0, 230, 118, 0.14);
  border-color: rgba(0, 230, 118, 0.45);
  color: var(--green);
}
.rant-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--slate);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 680;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.14s ease;
}
.rant-btn:hover {
  border-color: var(--red);
  color: var(--text);
}
.rant-btn.voted {
  background: var(--red-dim);
  border-color: rgba(255, 71, 87, 0.45);
  color: var(--red);
}
.severity-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 9px;
  border-radius: var(--r-sm);
}
.severity-pill[data-sev="critical"] {
  background: var(--red-dim);
  border: 1px solid rgba(255, 71, 87, 0.45);
  color: var(--red);
}
.severity-pill[data-sev="annoying"] {
  background: var(--amber-dim);
  border: 1px solid rgba(255, 196, 0, 0.45);
  color: var(--amber);
}
.severity-pill[data-sev="discussion"] {
  background: var(--blue-dim);
  border: 1px solid rgba(0, 132, 255, 0.4);
  color: var(--blue);
}
.composer-banner {
  background: linear-gradient(135deg, rgba(0, 132, 255, 0.1), rgba(0, 230, 118, 0.06) 65%, transparent), var(--charcoal);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.composer-banner.forum-rant {
  background: linear-gradient(135deg, rgba(255, 71, 87, 0.12), rgba(255, 196, 0, 0.06) 65%, transparent), var(--charcoal);
}
.composer-banner.market-store {
  background: linear-gradient(135deg, rgba(0, 230, 118, 0.12), rgba(0, 132, 255, 0.08) 65%, transparent), var(--charcoal);
}


/* ==========================================================================
   v4.3 VISUAL POLISH: CRISP BRAND LOGO & TIKTOK-STYLE COMMENT / REPLY SYSTEM
   ========================================================================== */
.brand-logo-svg {
  display: block;
  flex: 0 0 auto;
  border-radius: 22%;
  box-shadow: 0 2px 10px rgba(91, 25, 255, 0.38);
  transition: transform 0.16s ease, box-shadow 0.16s ease;
}
.brand:hover .brand-logo-svg {
  transform: scale(1.04) rotate(-2deg);
  box-shadow: 0 4px 14px rgba(91, 25, 255, 0.55);
}

/* TikTok-Style Comment Section & Nested Replies */
.tt-comments-box {
  background: #101216;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 6px;
}
.tt-comments-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-soft);
}
.tt-comment-list {
  display: flex;
  flex-direction: column;
  gap: 13px;
  max-height: 340px;
  overflow-y: auto;
  padding-right: 4px;
}
.tt-comment-item {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 10px;
  align-items: flex-start;
}
.tt-comment-item .avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
}
.tt-comment-main {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.tt-author-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.tt-author-name {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
}
.tt-author-name:hover {
  color: var(--text);
}
.tt-creator-tag {
  font-size: 10px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(255, 71, 87, 0.16);
  color: #FF5E6C;
  letter-spacing: 0.03em;
}
.tt-reply-to-tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11.5px;
  font-weight: 650;
  color: var(--blue);
}
.tt-comment-text {
  font-size: 13.3px;
  color: var(--text);
  line-height: 1.45;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.tt-meta-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--faint);
}
.tt-reply-trigger {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 11.5px;

      let h = 0xcbf29ce484222325n;

      for (let i = 0; i < s.length; i++) {
        h ^= BigInt(s.charCodeAt(i));
        h = (h * PRIME) % 0x10000000000000000n;
      }
      let h2 = 0x84222325cbf29ce4n;
      for (let i = s.length - 1; i >= 0; i--) {
        h2 ^= BigInt(s.charCodeAt(i));
        h2 = (h2 * PRIME) % 0x10000000000000000n;
      }
      return h.toString(16).padStart(16, '0') + h2.toString(16).padStart(16, '0');

      try {

          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(str)));
          return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        }

      return hashSync(str);

      return digest(assetId + '|' + Number(price) + '|' + String(creatorUSN).toLowerCase() + '|' + PRIVATE_SALT);
    }

      return hashSync('role-seal::' + usn + '::' + role + '::' + passHash + '::' + PRIVATE_RECORD_SEAL);
    }

    function passHashFor(pass, usn) {
      return hashSync('pw::' + pass + '::' + usn + '::' + PRIVATE_SALT);
    }

      const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz0123456789';
      let body = '';
      const rnd = (window.crypto && crypto.getRandomValues)
        ? crypto.getRandomValues(new Uint8Array(31))
        : Array.from({ length: 31 }, function () { return Math.floor(Math.random() * 256); });

    }

      if (Math.abs(a.length - b.length) > 3) return 99;
      const prev = new Array(b.length + 1);
      for (let j = 0; j <= b.length; j++) prev[j] = j;
      for (let i = 1; i <= a.length; i++) {

        for (let j = 1; j <= b.length; j++) {

        .replace(/0/g, 'o')
        .replace(/1/g, 'i')
        .replace(/3/g, 'e')
        .replace(/4/g, 'a')
        .replace(/5/g, 's')

      for (const root of PUBLIC_CONFIG.RESERVED_ROOTS) {
        if (usn.includes(root) || norm.includes(root)) return root;
        if (usn.length >= 4 && (distance(usn, root) <= 2 || distance(norm, root) <= 2)) return root;
        if (root.startsWith(usn) && usn.length >= 4) return root;
      }
      return null;
    }

          req.onsuccess = function () { resolve(req.result || null); };
          req.onerror = function () { resolve(null); };
        } catch (err) { resolve(null); }
      });

      const u = URL.createObjectURL(rec.blob);

          tx.oncomplete = function () { resolve(true); };
          tx.onerror = function () { resolve(false); };
        } catch (err) { resolve(false); }
      });

  /* Automatic SVG Icon Resolver for Tags & Categories */
  function iconForTag(label) {
    const s = String(label || '').toLowerCase();
    if (s.includes('scripter') || s.includes('luau') || s.includes('code')) return 'code';
    if (s.includes('builder') || s.includes('3d') || s.includes('model') || s.includes('map')) return 'cube3d';
    if (s.includes('ui') || s.includes('ux')) return 'layers';
    if (s.includes('gfx') || s.includes('art') || s.includes('render')) return 'palette';
    if (s.includes('anim') || s.includes('video') || s.includes('trailer')) return 'video';
    if (s.includes('sound') || s.includes('audio') || s.includes('sfx')) return 'music';
    if (s.includes('vfx') || s.includes('combat') || s.includes('shader')) return 'spark';
    if (s.includes('bug') || s.includes('lag')) return 'bug';
    if (s.includes('pajak') || s.includes('devex') || s.includes('robux')) return 'coin';
    if (s.includes('moderasi') || s.includes('ban')) return 'shield';
    return 'spark';
  }

  function identicon(usn) {
    const h = S.hashSync('ident:' + (usn || 'rcp'));
    const hue = parseInt(h.slice(0, 4), 16) % 360;
    const initials = String(usn || 'rcp').replace(/[^a-z0-9]/g, '').slice(0, 2).padEnd(2, '•').toUpperCase();
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">' +
      '<rect width="96" height="96" rx="14" fill="hsl(' + hue + ',45%,16%)"/>' +
      '<text x="48" y="60" font-family="system-ui,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="hsl(' + hue + ',85%,68%)">' + initials + '</text></svg>';
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }

  function avatar(user, size) {
    const px = size || 38;
    const src = user && user.avatarUrl ? user.avatarUrl : identicon(user ? user.usn : 'rcp');
    return '<img class="avatar" width="' + px + '" height="' + px + '" src="' + S.esc(src) +
      '" data-usn="' + S.esc(user ? user.usn : 'rcp') + '" alt="Avatar of ' + S.esc(user ? user.usn : 'creator') + '" loading="lazy" />';
  }

  function roleBadge(role) {
    const ico = role === 'owner' ? icon('verified', 11) : role === 'moderator' ? icon('shieldCheck', 11) : '';
    return '<span class="badge" data-role="' + S.esc(role) + '">' + ico + ' ' + S.esc(Core.RBAC.label(role)) + '</span>';
  }
  function statusPill(status) {
    const meta = CFG.STATUS[status] || CFG.STATUS.available;
    return '<span class="pill" data-status="' + S.esc(status) + '">' + meta.emoji + ' ' + S.esc(meta.label) + '</span>';
  }
  function chip(text) {
    const ico = icon(iconForTag(text), 12);
    return '<span class="chip">' + ico + '<span>' + S.esc(text) + '</span></span>';
  }
  function tonePill(text, tone) {
    return '<span class="pill" data-tone="' + S.esc(tone) + '">' + icon('spark', 12) + '<span>' + S.esc(text) + '</span></span>';
  }

  function toast(msg, type) {
    const host = document.getElementById('toasts');
    if (!host) return;
    const tone = type || 'info';
    const iconName = tone === 'success' ? 'check' : tone === 'error' ? 'alert' : tone === 'warn' ? 'alert' : 'spark';
    const el = document.createElement('div');
    el.className = 'toast ' + tone;
    el.innerHTML = icon(iconName, 17) + '<span>' + S.esc(msg) + '</span>';
    host.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transition = 'opacity .25s ease';
      setTimeout(function () { el.remove(); }, 260);
    }, 4200);
  }

  function modal(opts) {
    const host = document.getElementById('modals');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const actions = (opts.actions || []).map(function (a, i) {
      return '<button type="button" class="btn ' + (a.cls || '') + '" data-act="' + i + '">' + S.esc(a.label) + '</button>';
    }).join('');
    overlay.innerHTML =
      '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + S.esc(opts.title || 'Dialog') + '">' +
      '<div class="modal-head"><h3>' + S.esc(opts.title || '') + '</h3>' +
      '<button type="button" class="icon-btn" data-close="1" aria-label="Close dialog">' + icon('x', 18) + '</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (actions ? '<div class="modal-actions">' + actions + '</div>' : '') +
      '</div>';
    function close() { overlay.remove(); }
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) { close(); return; }
      const closeBtn = e.target.closest('[data-close]');
      if (closeBtn) { close(); return; }
      const actBtn = e.target.closest('[data-act]');
      if (actBtn) {
        const fn = (opts.actions || [])[Number(actBtn.dataset.act)];
        if (fn && fn.onClick) fn.onClick(close, overlay);
        else close();
      }
    });
    document.addEventListener('keydown', function handler(e) {
      if (e.key === 'Escape' && overlay.isConnected) { close(); }
      if (!overlay.isConnected) document.removeEventListener('keydown', handler);
    });
    host.appendChild(overlay);
    return close;
  }

  function confirmDialog(title, message, confirmLabel, danger, onYes) {
    modal({
      title: title,
      body: '<p class="muted">' + S.esc(message) + '</p>',
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        {
          label: confirmLabel || 'Confirm', cls: danger ? 'btn-danger' : 'btn-primary',
          onClick: function (close) { close(); onYes(); }
        }
      ]
    });
  }

  /* ==========================================================================
     TIKTOK-STYLE COMMENT & NESTED REPLY ENGINE
     Supports:
     - Top-level comments + nested sub-replies (`Balas` -> `@username`)
     - Per-comment / per-reply Heart likes with counter on the right column
     - "Kreator" badge when the post author comments/replies
     - Enter-to-send & Send paper-plane button
     - Instant persistence to `localStorage` (`showcases` or `forum`)
     ========================================================================== */
  function normalizeCommentList(rawArr) {
    return (rawArr || []).map(function (c, i) {
      return {
        id: c.id || ('cmt_' + i + '_' + (c.at || Date.now())),
        by: c.by || 'creator',
        text: c.text || c.body || '',
        at: c.at || Date.now(),
        likes: Array.isArray(c.likes) ? c.likes : [],
        replies: Array.isArray(c.replies) ? c.replies.map(function (r, j) {
          return {
            id: r.id || ('rep_' + i + '_' + j),
            by: r.by || 'creator',
            replyTo: r.replyTo || c.by,
            text: r.text || r.body || '',
            at: r.at || Date.now(),
            likes: Array.isArray(r.likes) ? r.likes : []
          };
        }) : []
      };
    });
  }

  function countAllComments(commentsArr) {
    const list = normalizeCommentList(commentsArr);
    return list.reduce(function (sum, c) { return sum + 1 + (c.replies ? c.replies.length : 0); }, 0);
  }

  function renderTikTokComments(tableKey, recordId, postOwnerUSN, rawComments, me) {
    const comments = normalizeCommentList(rawComments);
    const totalCount = countAllComments(comments);

    const itemsHtml = comments.length
      ? comments.map(function (c) {
        const cUser = Store.get('users', c.by);
        const isCreator = c.by === postOwnerUSN;
        const cLiked = me && c.likes.indexOf(me.usn) !== -1;

        const subRepliesHtml = (c.replies && c.replies.length)
          ? '<div class="tt-replies-wrap" data-replies-wrap="' + S.esc(c.id) + '">' +
            c.replies.map(function (r) {
              const rUser = Store.get('users', r.by);
              const rIsCreator = r.by === postOwnerUSN;
              const rLiked = me && r.likes.indexOf(me.usn) !== -1;
              return '<div class="tt-comment-item">' +
                '<a href="#/u/' + S.esc(r.by) + '">' + avatar(rUser, 24) + '</a>' +
                '<div class="tt-comment-main">' +
                '<div class="tt-author-row">' +
                '<a class="tt-author-name" href="#/u/' + S.esc(r.by) + '">@' + S.esc(r.by) + '</a>' +
                (rIsCreator ? '<span class="tt-creator-tag">Kreator</span>' : '') +
                (r.replyTo ? '<span class="tt-reply-to-tag">' + icon('chevron', 11) + ' @' + S.esc(r.replyTo) + '</span>' : '') +

                '<span>' + S.esc(timeAgo(r.at)) + '</span>' +
                '<button type="button" class="tt-reply-trigger" data-tt-reply-target="' + S.esc(c.id) + '" data-tt-reply-user="' + S.esc(r.by) + '">Balas</button>' +
                '</div></div>' +
                '<button type="button" class="tt-heart-col' + (rLiked ? ' liked' : '') + '" data-tt-like-cmt="' + S.esc(c.id) + '" data-tt-like-rep="' + S.esc(r.id) + '">' +
                icon('heart', 14) + '<span>' + r.likes.length + '</span></button>' +
                '</div>';
            }).join('') +
            '</div>'
          : '';

        return '<div class="tt-comment-item" data-cmt-id="' + S.esc(c.id) + '">' +
          '<a href="#/u/' + S.esc(c.by) + '">' + avatar(cUser, 32) + '</a>' +
          '<div class="tt-comment-main">' +
          '<div class="tt-author-row">' +
          '<a class="tt-author-name" href="#/u/' + S.esc(c.by) + '">@' + S.esc(c.by) + '</a>' +
          (isCreator ? '<span class="tt-creator-tag">Kreator</span>' : '') +
          '</div>' +
          '<div class="tt-comment-text">' + S.esc(S.guard(c.text)) + '</div>' +
          '<div class="tt-meta-actions">' +
          '<span>' + S.esc(timeAgo(c.at)) + '</span>' +
          '<button type="button" class="tt-reply-trigger" data-tt-reply-target="' + S.esc(c.id) + '" data-tt-reply-user="' + S.esc(c.by) + '">Balas</button>' +
          '</div>' +
          subRepliesHtml +
          '</div>' +
          '<button type="button" class="tt-heart-col' + (cLiked ? ' liked' : '') + '" data-tt-like-cmt="' + S.esc(c.id) + '">' +
          icon('heart', 15) + '<span>' + c.likes.length + '</span></button>' +
          '</div>';
      }).join('')
      : '<div class="muted" style="font-size:12.5px;text-align:center;padding:10px 0">Belum ada komentar. Jadilah yang pertama berkomentar!</div>';

    return '<div class="tt-comments-box" data-tt-box="' + S.esc(recordId) + '" data-tt-table="' + S.esc(tableKey) + '" data-tt-field="' + (tableKey === 'forum' ? 'replies' : 'comments') + '">' +
      '<div class="tt-comments-header">' +
      '<span class="row" style="gap:6px">' + icon('forum', 14) + ' <span>' + totalCount + ' Komentar & Balasan</span></span>' +
      '<span class="faint">Gaya Interaksi TikTok</span></div>' +
      '<div class="tt-comment-list">' + itemsHtml + '</div>' +
      (me
        ? '<div class="tt-composer-wrap">' +
          '<div class="tt-replying-banner hidden" data-tt-banner="' + S.esc(recordId) + '">' +
          '<span data-tt-banner-txt="' + S.esc(recordId) + '">Membalas @username</span>' +
          '<button type="button" class="tt-replying-cancel" data-tt-cancel-reply="' + S.esc(recordId) + '" title="Batal membalas">' + icon('x', 14) + '</button>' +
          '</div>' +

          '<input type="text" data-tt-input="' + S.esc(recordId) + '" placeholder="Tambahkan komentar…" maxlength="600" autocomplete="off" />' +
          '<button type="button" class="tt-send-btn" data-tt-send="' + S.esc(recordId) + '" title="Kirim komentar">' + icon('send', 14) + '</button>' +
          '</div></div>'
        : '<div style="text-align:center;padding-top:6px"><a class="btn btn-sm btn-ghost" href="#/auth">Sign in untuk menulis atau membalas komentar</a></div>') +
      '</div>';
  }

  function wireTikTokComments(rootEl, onRefresh) {
    if (!rootEl || rootEl.dataset.ttWired === '1') return;
    rootEl.dataset.ttWired = '1';

    /* State map per recordId for active reply target: recordId -> { parentCmtId, replyToUser } */
    const replyState = new Map();

    function submitCommentForBox(box) {
      const me = Modules.Auth.current();
      if (!me) {
        toast('Sign in terlebih dahulu untuk mengirim komentar.', 'warn');
        Modules.Main.navigate('/auth');
        return;
      }
      const recordId = box.dataset.ttBox;
      const tableKey = box.dataset.ttTable;
      const fieldName = box.dataset.ttField;
      const inp = box.querySelector('[data-tt-input="' + recordId + '"]');
      if (!inp) return;

      const rawText = inp.value.trim();
      if (!rawText) {
        toast('Tulis isi komentar terlebih dahulu.', 'warn');
        inp.focus();
        return;
      }
      const scan = S.sanitize(rawText);
      if (scan.flags.length) {
        toast('Pola nomor identitas pemerintah disensor otomatis.', 'warn');
        S.logViolation(me.usn, 'PII_REDACTED', 'Comment contained restricted ID pattern.');
      }

      const rec = Store.get(tableKey, recordId);
      if (!rec) return;
      const comments = normalizeCommentList(rec[fieldName]);
      const activeReply = replyState.get(recordId);

      if (activeReply && activeReply.parentCmtId) {
        const parent = comments.find(function (c) { return c.id === activeReply.parentCmtId; });
        if (parent) {
          parent.replies = parent.replies || [];
          parent.replies.push({
            id: S.uuid('rep'),
            by: me.usn,
            replyTo: activeReply.replyToUser,
            text: scan.clean.slice(0, 600),
            at: Date.now(),
            likes: []
          });
        } else {
          comments.push({
            id: S.uuid('cmt'),
            by: me.usn,
            text: scan.clean.slice(0, 600),
            at: Date.now(),
            likes: [],
            replies: []
          });
        }

  async function resolveRoblox(robloxName) {
    const cleanName = String(robloxName || '').trim();
    if (!cleanName) throw new Error('Roblox account name is required.');

      if (!thumb.ok) throw new Error('Roblox thumbnail API responded ' + thumb.status);

      /* Official Roblox thumbnail endpoint fallback + deterministic SVG identicon */
      return {

        avatarUrl: Modules.UI.identicon(cleanName.toLowerCase()),
        avatarSync: 'fallback'
      };
    }
  }

  async function syncAvatar(usn) {
    const user = Store.get('users', usn);
    if (!user) return null;
    const resolved = await resolveRoblox(user.robloxName);
    return Store.update('users', usn, {
      avatarUrl: resolved.avatarUrl,
      avatarSync: resolved.avatarSync,
      robloxUserId: resolved.robloxUserId
    });
  }

  async function register(input) {
    const errors = [];
    const usn = String(input.usn || '').toLowerCase().replace(/\s+/g, '');
    const pass = String(input.pass || '');
    const pass2 = String(input.pass2 || '');

    for (const fieldName of ['usn', 'pass', 'robloxName']) {

    if (hit) {
      S.logViolation(usn, 'IMPERSONATION_BLOCKED', 'Blocked registration matching reserved staff root "' + hit + '".');
      errors.push('Username blocked by anti-impersonation policy: matches reserved staff root "' + hit + '".');
    }
    if (Store.get('users', usn)) errors.push('Username "' + usn + '" is already registered on this device.');
    if (pass.length < 8 || !/[a-zA-Z]/.test(pass) || !/[0-9]/.test(pass)) errors.push('Password requires 8+ characters with at least one letter and one digit.');
    if (pass !== pass2) errors.push('Password confirmation does not match.');
    if (!robloxName) errors.push('Validated Roblox account name is required for dynamic headshot sync.');
    if (errors.length) throw new Error(errors.join(' '));

    const resolved = await resolveRoblox(robloxName);
    const passHash = S.passHashFor(pass, usn);
    const now = Date.now();
    const user = {
      usn: usn,
      passHash: passHash,
      role: 'user',
      displayName: usn,
      headline: 'Roblox Creator & Developer',
      robloxName: resolved.robloxName,
      robloxUserId: resolved.robloxUserId,
      avatarUrl: resolved.avatarUrl,

      status: 'available',
      bio: '',
      experienceYears: 2,
      paymentMethod: 'Robux Group Payout / DevEx',
      commission: { minPrice: 500, turnaround: '3–5 Days' },
      style: { accent: CFG.ACCENTS[0], pattern: 'grid' },
      flags: [],
      joinedAt: now
    };
    const inserted = Store.insert('users', user);
    if (!inserted) throw new Error('Account creation failed: username collision.');
    Core.Audit.log(usn, 'ACCOUNT_CREATED', 'Registered verified creator account.');
    Store.sessionSet(usn, passHash);
    return inserted;
  }

  function login(usnRaw, pass) {
    const usn = String(usnRaw || '').toLowerCase().replace(/\s+/g, '');
    const lock = failedAttempts.get(usn);
    if (lock && lock.lockUntil > Date.now()) {
      const waitSec = Math.ceil((lock.lockUntil - Date.now()) / 1000);
      throw new Error('Account temporarily locked due to failed attempts. Try again in ' + waitSec + 's.');
    }
    const user = Store.get('users', usn);
    if (!user) throw new Error('No account found for "' + usn + '" on this device.');
    const expectedHash = S.passHashFor(pass, usn);
    if (user.passHash !== expectedHash) {
      const prev = failedAttempts.get(usn) || { count: 0, lockUntil: 0 };
      prev.count += 1;
      if (prev.count >= 5) {
        prev.lockUntil = Date.now() + 30000;

      }
      failedAttempts.set(usn, prev);
      Core.Audit.log(usn, 'LOGIN_FAILED', 'Incorrect password attempt.');
      throw new Error('Incorrect password.');
    }
    failedAttempts.delete(usn);
    Store.sessionSet(usn, user.passHash);
    Core.Audit.log(usn, 'LOGIN', 'Authenticated session sealed.');
    return user;
  }

  function logout() {
    const me = Store.sessionGet();
    if (me) Core.Audit.log(me.usn, 'LOGOUT', 'Session closed.');
    Store.sessionClear();
  }

  function current() {
    return Store.sessionGet();
  }

  return Object.freeze({
    register: register,
    login: login,
    logout: logout,
    current: current,
    syncAvatar: syncAvatar,
    resolveRoblox: resolveRoblox
  });
});

              if (x > maxX) maxX = x;

              if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX >= minX && maxY >= minY) {
          const gw = maxX - minX + 1;
          const gh = maxY - minY + 1;
          normCtx.fillStyle = '#000000';
          normCtx.fillRect(0, 0, 12, 16);
          normCtx.drawImage(c, minX, minY, gw, gh, 0, 0, 12, 16);
          const nd = normCtx.getImageData(0, 0, 12, 16).data;
          const vec = new Uint8Array(192);
          for (let k = 0; k < 192; k++) {
            vec[k] = nd[k * 4] > 105 ? 1 : 0;
          }
          bank[ch].push(vec);
        }
      }
    }
    cachedOcrTemplates = bank;
    return bank;
  }

  function matchGlyph12x16(vec) {
    const bank = buildRuntimeOcrTemplates();
    let bestChar = '?';
    let bestScore = -1;
    const chars = Object.keys(bank);
    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i];
      const list = bank[ch];
      for (let j = 0; j < list.length; j++) {
        const tv = list[j];
        let inter = 0;
        let union = 0;
        let eq = 0;
        for (let k = 0; k < 192; k++) {
          const a = vec[k];
          const b = tv[k];
          if (a === b) eq++;
          if (a === 1 && b === 1) inter++;
          if (a === 1 || b === 1) union++;
        }
        const iou = inter / Math.max(1, union);
        const ham = eq / 192;
        const score = 0.62 * iou + 0.38 * ham;
        if (score > bestScore) {
          bestScore = score;
          bestChar = ch;
        }
      }
    }
    return { ch: bestChar, score: bestScore };
  }

  /* Reads the Robux nominal text inside a candidate ROI box [rx0, ry0, rx1, ry1] on the full image */
  function readRoiNominalOnImage(img, rx0, ry0, rx1, ry1) {
    const roiW = Math.max(16, Math.round(rx1 - rx0));
    const roiH = Math.max(12, Math.round(ry1 - ry0));
    const c = document.createElement('canvas');
    c.width = roiW;
    c.height = roiH;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, rx0, ry0, roiW, roiH, 0, 0, roiW, roiH);
    const data = ctx.getImageData(0, 0, roiW, roiH).data;

    /* Compute luminance array and median background luminance */
    const lum = new Float32Array(roiW * roiH);
    const sortedLum = new Float32Array(roiW * roiH);
    for (let i = 0; i < roiW * roiH; i++) {
      const p = i * 4;
      const l = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
      lum[i] = l;
      sortedLum[i] = l;
    }
    sortedLum.sort();
    const bgLum = sortedLum[Math.floor(sortedLum.length * 0.5)];

    /* Binarize foreground strokes (dark text on light pill OR bright/emerald text on dark UI) */
    const fg = new Uint8Array(roiW * roiH);
    for (let i = 0; i < roiW * roiH; i++) {
      if (bgLum >= 128) {
        fg[i] = lum[i] < (bgLum - 48) ? 1 : 0;
      } else {
        const p = i * 4;
        const isBrightOrEmerald = (lum[i] > bgLum + 48) || (data[p + 1] > 145 && data[p + 1] > data[p] * 1.2);
        fg[i] = isBrightOrEmerald ? 1 : 0;
      }
    }

    /* Find vertical text band ty0..ty1 */
    let ty0 = -1;
    let ty1 = -1;
    for (let y = 0; y < roiH; y++) {
      let rowSum = 0;
      for (let x = 0; x < roiW; x++) rowSum += fg[y * roiW + x];
      if (rowSum >= 2) {
        if (ty0 === -1) ty0 = y;
        ty1 = y;
      }
    }
    if (ty0 === -1 || (ty1 - ty0 + 1) < 8) return null;
    const lineH = ty1 - ty0 + 1;

    /* Segment horizontal character columns x0..x1 */
    const segs = [];
    let startX = -1;
    for (let x = 0; x < roiW; x++) {
      let colSum = 0;
      for (let y = ty0; y <= ty1; y++) colSum += fg[y * roiW + x];
      if (colSum >= 1) {
        if (startX === -1) startX = x;
      } else if (startX !== -1) {
        if (x - startX >= 2) segs.push([startX, x - 1]);
        startX = -1;
      }
    }
    if (startX !== -1 && (roiW - startX) >= 2) {
      segs.push([startX, roiW - 1]);
    }
    if (!segs.length || segs.length > 14) return null;

    /* Classify each character segment */
    const glyphCanvas = document.createElement('canvas');
    glyphCanvas.width = 12;
    glyphCanvas.height = 16;
    const glyphCtx = glyphCanvas.getContext('2d');

    let rawText = '';
    let scoreSum = 0;
    let charCount = 0;
    let minSegX = roiW;
    let maxSegX = 0;

    for (let sIdx = 0; sIdx < segs.length; sIdx++) {
      const x0 = segs[sIdx][0];
      const x1 = segs[sIdx][1];
      let cy0 = lineH;
      let cy1 = -1;
      for (let y = 0; y < lineH; y++) {
        for (let x = x0; x <= x1; x++) {
          if (fg[(ty0 + y) * roiW + x]) {
            if (y < cy0) cy0 = y;
            if (y > cy1) cy1 = y;
          }
        }
      }
      if (cy1 < cy0) continue;
      const chH = cy1 - cy0 + 1;
      const chW = x1 - x0 + 1;

      if (x0 < minSegX) minSegX = x0;
      if (x1 > maxSegX) maxSegX = x1;

      /* Check if punctuation (decimal dot '.' or comma ',') near baseline */
      if (chH < lineH * 0.44 && cy0 > lineH * 0.44) {
        rawText += '.';
        continue;
      }
      /* Ignore tiny noise specks */
      if (chH < lineH * 0.45 && chW < 4) continue;

      /* Extract binary patch of the character and resize to 12x16 */
      const patchCanvas = document.createElement('canvas');
      patchCanvas.width = chW;
      patchCanvas.height = chH;
      const pCtx = patchCanvas.getContext('2d');
      const pImg = pCtx.createImageData(chW, chH);
      for (let py = 0; py < chH; py++) {
        for (let px = 0; px < chW; px++) {
          const isOn = fg[(ty0 + cy0 + py) * roiW + (x0 + px)];
          const o = (py * chW + px) * 4;
          pImg.data[o] = isOn ? 255 : 0;
          pImg.data[o + 1] = isOn ? 255 : 0;
          pImg.data[o + 2] = isOn ? 255 : 0;
          pImg.data[o + 3] = 255;
        }
      }
      pCtx.putImageData(pImg, 0, 0);

      glyphCtx.fillStyle = '#000000';
      glyphCtx.fillRect(0, 0, 12, 16);
      glyphCtx.drawImage(patchCanvas, 0, 0, chW, chH, 0, 0, 12, 16);
      const gd = glyphCtx.getImageData(0, 0, 12, 16).data;
      const vec = new Uint8Array(192);
      for (let k = 0; k < 192; k++) {
        vec[k] = gd[k * 4] > 105 ? 1 : 0;
      }

      const matched = matchGlyph12x16(vec);
      rawText += matched.ch;
      scoreSum += matched.score;
      charCount++;
    }

    if (!charCount) return null;
    /* Clean trailing/leading punctuation and parse numeric value */
    const cleanedText = rawText.replace(/^[.,]+|[.,]+$/g, '');
    if (!/\d/.test(cleanedText)) return null;

    /* If cleanedText has '.' followed by 3 digits and NO K/M (e.g. "15.000"), format display with comma "15,000" */
    const displayOcrText = (/^\d+\.\d{3}$/.test(cleanedText))
      ? cleanedText.replace('.', ',')
      : cleanedText;
    const parsedAmount = parseRobuxNominalInput(cleanedText);
    if (parsedAmount <= 0) return null;

    return {
      found: true,
      text: displayOcrText,
      amount: parsedAmount,
      confidence: scoreSum / charCount,
      box: {
        x0: rx0 + minSegX,
        y0: ry0 + ty0,
        x1: rx0 + maxSegX,
        y1: ry0 + ty1
      }
    };
  }

  function extractNominalViaCanvasOCR(img, hexLogoScan) {
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    const candidates = [];

    /* Candidate 1: Immediately to the right of the detected Hexagonal Robux Logo (e.g. Balance Pill `38.7K`) */
    if (hexLogoScan && hexLogoScan.found && hexLogoScan.x >= 0) {
      const lx = hexLogoScan.x / 200;
      const ly = hexLogoScan.y / 120;
      const rx0 = Math.min(w - 12, Math.round((lx + 0.075) * w));
      const rx1 = Math.round(w * 0.95);
      const ry0 = Math.max(0, Math.round((ly - 0.14) * h));
      const ry1 = Math.min(h, Math.round((ly + 0.14) * h));
      if (rx1 - rx0 >= 24) {
        const c1 = readRoiNominalOnImage(img, rx0, ry0, rx1, ry1);
        if (c1 && c1.found) candidates.push(c1);
      }
    }

    /* Candidate 2: Bottom Total Verified Net Robux Bar in Full-Screen Transaction Ledger (760x420) */
    const c2 = readRoiNominalOnImage(img, Math.round(w * 0.708), Math.round(h * 0.76), Math.round(w * 0.94), Math.round(h * 0.88));
    if (c2 && c2.found) candidates.push(c2);

    /* Candidate 3: Centered Balance Pill fallback */
    const c3 = readRoiNominalOnImage(img, Math.round(w * 0.34), Math.round(h * 0.25), Math.round(w * 0.94), Math.round(h * 0.65));
    if (c3 && c3.found) candidates.push(c3);

    if (!candidates.length) return { found: false, text: '', amount: 0, confidence: 0, box: null };
    candidates.sort(function (a, b) { return b.confidence - a.confidence; });
    return candidates[0];
  }

  function evaluateCreatorWealthProfile(user, tierOverride) {
    const rawExp = user && user.experienceYears != null ? Number(user.experienceYears) : 2;
    const expYears = Number.isNaN(rawExp) ? 2 : rawExp;
    const publishedWorks = Store.count('market', function (m) { return m.creatorUSN === (user && user.usn); });
    const showcaseWorks = Store.count('showcases', function (s) { return s.creatorUSN === (user && user.usn); });
    const completedSales = Store.count('txns', function (t) { return t.sellerUSN === (user && user.usn) && t.state === 'completed'; });
    const bioLen = String((user && user.bio) || '').trim().length;
    const tagCount = Array.isArray(user && user.tags) ? user.tags.length : 0;
    const savedTier = tierOverride || (user && user.creatorTier) || 'auto';

    let maturityScore = 0;
    maturityScore += Math.min(40, expYears * 12);
    maturityScore += Math.min(30, publishedWorks * 12 + showcaseWorks * 8);
    maturityScore += Math.min(20, completedSales * 10);
    if (bioLen >= 20) maturityScore += 5;
    if (tagCount >= 1) maturityScore += 5;

    let tier = 'Menengah (Mid-Tier)';
    let tierKey = 'sedang';
    let maxNaturalRobux = 150000;

    if (savedTier === 'kaya' || (savedTier === 'auto' && (maturityScore >= 56 || expYears >= 5 || completedSales >= 3 || publishedWorks >= 3))) {
      tier = 'Kaya / Veteran Studio';
      tierKey = 'kaya';
      maxNaturalRobux = 10000000;
      maturityScore = Math.max(maturityScore, 78);
    } else if (savedTier === 'pemula' || (savedTier === 'auto' && expYears <= 0 && publishedWorks === 0 && showcaseWorks === 0 && completedSales === 0)) {
      tier = 'Pemula (Rookie)';
      tierKey = 'pemula';
      maxNaturalRobux = 950;
      maturityScore = Math.min(maturityScore, 18);
    } else {
      tier = 'Menengah (Mid-Tier)';
      tierKey = 'sedang';
      maxNaturalRobux = 150000;
      maturityScore = Math.max(maturityScore, 38);
    }

    return {
      tier: tier,
      tierKey: tierKey,
      maturityScore: maturityScore,
      expYears: expYears,
      publishedWorks: publishedWorks,
      showcaseWorks: showcaseWorks,
      completedSales: completedSales,
      maxNaturalRobux: maxNaturalRobux
    };
  }

  function detectRobuxHexLogoOnCanvas(ctx, cw, ch, data) {
    let bestScore = 0;
    let bestX = -1;
    let bestY = -1;
    let bestRad = 6;
    let totalClusters = 0;
    const radii = [4, 6, 8, 10];

    for (let y = 10; y < ch - 10; y += 2) {
      for (let x = 10; x < cw - 10; x += 2) {
        const cIdx = (y * cw + x) * 4;
        const cr = data[cIdx];
        const cg = data[cIdx + 1];
        const cb = data[cIdx + 2];
        const cLum = 0.299 * cr + 0.587 * cg + 0.114 * cb;
        const cSat = Math.max(cr, cg, cb) - Math.min(cr, cg, cb);

        for (let rIdx = 0; rIdx < radii.length; rIdx++) {
          const rad = radii[rIdx];
          if (x - rad < 2 || x + rad >= cw - 2 || y - rad < 2 || y + rad >= ch - 2) continue;
          const d = Math.max(2, Math.round(rad * 0.72));
          const offsets = [
            [-rad, 0], [rad, 0], [0, -rad], [0, rad],
            [-d, -d], [d, -d], [-d, d], [d, d]
          ];

          if (cLum <= 88) {
            let ringHits = 0;
            let colorHits = 0;
            let scoreSum = 0;
            for (let k = 0; k < offsets.length; k++) {
              const rx = x + offsets[k][0];
              const ry = y + offsets[k][1];
              const pIdx = (ry * cw + rx) * 4;
              const rr = data[pIdx];
              const rg = data[pIdx + 1];
              const rb = data[pIdx + 2];
              const rLum = 0.299 * rr + 0.587 * rg + 0.114 * rb;
              const rSat = Math.max(rr, rg, rb) - Math.min(rr, rg, rb);
              const isEmeraldOrGoldOrWhite = (rLum > 130) || (rg > 140 && rg > rr * 1.15) || (rr > 165 && rg > 115 && rb < 105);
              if (isEmeraldOrGoldOrWhite && (rLum - cLum) > 45) {
                ringHits++;
                if (rSat >= 18) colorHits++;
                scoreSum += (rLum - cLum) + rSat * 1.5;
              }
            }
            if (ringHits >= 6 && (colorHits >= 3 || scoreSum >= 520)) {
              totalClusters++;
              if (scoreSum > bestScore) {
                bestScore = scoreSum;
                bestX = x;
                bestY = y;
                bestRad = rad;
              }
            }
          } else if (cLum >= 182 && cSat <= 28) {
            let ringHits = 0;
            let goldOrEmeraldHits = 0;
            let scoreSum = 0;
            for (let k = 0; k < offsets.length; k++) {
              const rx = x + offsets[k][0];
              const ry = y + offsets[k][1];
              const pIdx = (ry * cw + rx) * 4;
              const rr = data[pIdx];
              const rg = data[pIdx + 1];
              const rb = data[pIdx + 2];
              const rLum = 0.299 * rr + 0.587 * rg + 0.114 * rb;
              const rSat = Math.max(rr, rg, rb) - Math.min(rr, rg, rb);
              const isGoldOrEmeraldRing = (rSat >= 15 && ((rr > rb + 10 && rg > rb + 4) || (rg > rr + 12)) && (cLum - rLum) > 16);
              if (isGoldOrEmeraldRing) {
                ringHits++;
                goldOrEmeraldHits++;
                scoreSum += rSat * 2.6 + (cLum - rLum);
              }
            }
            if (ringHits >= 6 && goldOrEmeraldHits >= 5) {
              totalClusters++;
              if (scoreSum > bestScore) {
                bestScore = scoreSum;
                bestX = x;
                bestY = y;
                bestRad = rad;
              }
            }
          }
        }
      }
    }
    return {
      found: totalClusters >= 1,
      clusters: totalClusters,
      x: bestX,
      y: bestY,
      rad: bestRad
    };
  }

  function computeImageDHash(ctx, img) {
    const hc = document.createElement('canvas');
    hc.width = 9;
    hc.height = 8;
    const hctx = hc.getContext('2d');
    hctx.drawImage(img, 0, 0, 9, 8);
    const px = hctx.getImageData(0, 0, 9, 8).data;
    let bits = '';
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        const i1 = (y * 9 + x) * 4;
        const i2 = (y * 9 + (x + 1)) * 4;
        const l1 = 0.299 * px[i1] + 0.587 * px[i1 + 1] + 0.114 * px[i1 + 2];
        const l2 = 0.299 * px[i2] + 0.587 * px[i2 + 1] + 0.114 * px[i2 + 2];
        bits += (l1 > l2 ? '1' : '0');
      }
    }
    return bits;
  }

  async function analyzeRobuxScreenshot(file, claimedAmount, sourceType, originClaim, giftCodeInput, user, tierOverride) {
    return new Promise(function (resolve) {
      const amount = parseRobuxNominalInput(claimedAmount);
      const abbrevStr = formatRobuxAbbrev(amount);
      const profileEval = evaluateCreatorWealthProfile(user, tierOverride);

      if (!file || !/^image\//.test(file.type)) {
        resolve({
          valid: false,
          score: 0,
          plausibility: 0,
          profileTier: profileEval.tier,
          checks: [{ label: 'Format File Gambar', pass: false, detail: 'Bukan file gambar valid' }],
          reason: 'File yang diunggah bukan gambar screenshot (.PNG / .JPG / .WEBP).'
        });
        return;
      }

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;

        const cw = 200;
        const ch = 120;
        const canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        const data = ctx.getImageData(0, 0, cw, ch).data;
        const totalPx = cw * ch;

        const dHash = computeImageDHash(ctx, img);
        const fname = String(file.name || '').toLowerCase();

        /* 1. Anti-Pinterest / Internet Repost Forensics */
        const isPinterestFilename = /(?:pinterest|pinimg|pin_download|pinterest_pin|repost_pin|palsu|invalid)/i.test(fname);
        const allUsers = Store.list('users');
        let duplicateHashHit = false;
        allUsers.forEach(function (u) {
          (u.robuxProofs || []).forEach(function (p) {
            if (p && p.valid && p.dHash && p.dHash === dHash && u.usn !== user.usn) {
              duplicateHashHit = true;
            }
          });
        });
        const antiPinPass = !isPinterestFilename && !duplicateHashHit && w >= 110 && h >= 45;

        /* 2. Roblox UI Surface & 2D Bidirectional Edge Contrast */
        let robloxDarkPx = 0;
        let robloxLightOrSilverPx = 0;
        let robuxGiftBadgePx = 0;
        let darkGlyphPx = 0;
        let lightSurfacePx = 0;
        let sharpTextEdges2D = 0;
        let lumSum = 0;
        let lumSqSum = 0;

        for (let y = 0; y < ch; y++) {
          for (let x = 0; x < cw; x++) {
            const i = (y * cw + x) * 4;
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;
            lumSum += lum;
            lumSqSum += lum * lum;

            const maxC = Math.max(r, g, b);
            const minC = Math.min(r, g, b);
            const sat = maxC - minC;

            if (lum >= 6 && lum <= 68 && sat <= 34) robloxDarkPx++;
            if (lum >= 130 && sat <= 36) robloxLightOrSilverPx++;

            if (lum < 95) darkGlyphPx++;
            if (lum > 165) lightSurfacePx++;

            if ((r > 120 && b > 195) || (g > 160 && g > r * 1.25) || (r > 175 && g > 130 && b < 115 && sat >= 20)) {
              robuxGiftBadgePx++;
            }

            if (x > 0) {
              const prevIx = (y * cw + (x - 1)) * 4;
              const prevLumX = 0.299 * data[prevIx] + 0.587 * data[prevIx + 1] + 0.114 * data[prevIx + 2];
              if (Math.abs(lum - prevLumX) > 26) sharpTextEdges2D++;
            }
            if (y > 0) {
              const prevIy = ((y - 1) * cw + x) * 4;
              const prevLumY = 0.299 * data[prevIy] + 0.587 * data[prevIy + 1] + 0.114 * data[prevIy + 2];
              if (Math.abs(lum - prevLumY) > 26) sharpTextEdges2D++;
            }
          }
        }

        const meanLum = lumSum / totalPx;
        const stdLum = Math.sqrt(Math.max(0, (lumSqSum / totalPx) - (meanLum * meanLum)));
        const uiThemeRatio = (robloxDarkPx + robloxLightOrSilverPx) / totalPx;
        const edgeRatio2D = sharpTextEdges2D / totalPx;
        const hasBimodalDigits = ((darkGlyphPx / totalPx) >= 0.006 && (lightSurfacePx / totalPx) >= 0.20) ||
                                 ((lightSurfacePx / totalPx) >= 0.006 && (robloxDarkPx / totalPx) >= 0.20);

        /* 3. Official Hexagonal Robux Logo Detection */
        const hexLogoScan = detectRobuxHexLogoOnCanvas(ctx, cw, ch, data);
        const hasRobuxLogo = hexLogoScan.found && !isPinterestFilename;

        /* 4. Real 12x16 Bitmap Glyph OCR & Strict Nominal-to-Photo Matching */
        const ocrScan = extractNominalViaCanvasOCR(img, hexLogoScan);
        const uiSurfaceOk = (uiThemeRatio >= 0.28) && (edgeRatio2D >= 0.010 || (hasBimodalDigits && hasRobuxLogo)) && (stdLum >= 8) && !isPinterestFilename;
        const exactNominalMatch = ocrScan.found && (amount === ocrScan.amount);
        const uiAndOcrPass = uiSurfaceOk && exactNominalMatch;

        let stage3Detail = '';
        if (!uiSurfaceOk) {

        } else {

        }

        /* 5. Gift Robux / Redeem Gift Card Evidence Verification */
        const isGiftOrRedeemClaim = originClaim === 'gift' || originClaim === 'redeem';
        const cleanGiftCode = String(giftCodeInput || '').trim().toUpperCase();
        const hasValidGiftCodeFormat = /^(?:RBX-[A-Z0-9]{4,12}|GIFT-[A-Z0-9]{4,12}|PIN-\d{4,12}|PLS-\d{3,10}|GROUP-\d{3,12})$/i.test(cleanGiftCode);
        const hasVisualGiftBanner = (robuxGiftBadgePx / totalPx) >= 0.008 || fname.includes('gift') || fname.includes('redeem') || hasRobuxLogo;
        const giftEvidenceVerified = isGiftOrRedeemClaim
          ? (hasVisualGiftBanner && (hasValidGiftCodeFormat || fname.includes('gift_redeem_verified')))
          : true;

        /* 6. Creator Profile Tier & Plausibility Probability Calculation */
        let plausibilityPct = 92;
        let profilePlausibilityPass = true;
        let plausibilityDetail = '';

        if (profileEval.tierKey === 'pemula') {
          if (amount >= 1000) {
            if (isGiftOrRedeemClaim && giftEvidenceVerified && hasRobuxLogo) {

        resolve({
